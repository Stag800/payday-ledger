    if (lsTimer) { clearTimeout(lsTimer); lsTimer = null; if (MODE === 'local') lsSet(LS_KEY, JSON.stringify({ settings: S.settings, items: S.items, txns: S.txns })); }
    if (cacheTimer) { clearTimeout(cacheTimer); if (MODE === 'sync') writeCache(); }
  }
  window.addEventListener('pagehide', flushSaves);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSaves(); });

  function startSync(uid) {
    stopSync();
    MODE = 'sync';
    Store.loaded = { s: false, i: false, m: false }; Store.migrated = false; Store.failed = false; Store.offline = false;
    S.settings = {}; S.items = {}; S.txns = {};
    const F = FBX.F;
    const base = F.doc(FBX.db, 'users', uid);
    Store.refs = { base, items: F.collection(base, 'items'), months: F.collection(base, 'months') };
    const onErr = e => {
      Store.failed = true; Store.loaded = { s: true, i: true, m: true };
      syncChip(); changed();
      toast(e && e.code === 'permission-denied' ? 'Sync was refused. Check the Firestore rules in your Firebase project (Settings, Sync).' : 'Sync stopped. Close and reopen the app to reconnect.');
    };
    unsubs.push(F.onSnapshot(base, s => {
      S.settings = s.exists() ? clone(s.data()) || {} : {};
      Store.loaded.s = true; afterSnap();
    }, onErr));
    unsubs.push(F.onSnapshot(Store.refs.items, qs => {
      const o = {};
      qs.forEach(d => { o[d.id] = Object.assign(clone(d.data()), { id: d.id }); });
      S.items = o; Store.loaded.i = true; afterSnap();
    }, onErr));
    unsubs.push(F.onSnapshot(Store.refs.months, qs => {
      const o = {};
      qs.forEach(d => { const t = (d.data() || {}).t || {}; for (const k in t) if (t[k] && t[k].date) o[k] = Object.assign(clone(t[k]), { id: k }); });
      S.txns = o; Store.loaded.m = true; afterSnap();
    }, onErr));
    syncChip(); changed();
  }
  function stopSync() { for (const u of unsubs) { try { u(); } catch (e) { /* ignore */ } } unsubs = []; Store.refs = null; }
  function afterSnap() {
    if (isReady()) {
      if (!Store.migrated) { Store.migrated = true; maybeMigrate(); }
      persistCache();
    }
    syncChip(); changed();
  }
  function maybeMigrate() {
    const empty = !S.settings.anchor && !Object.keys(S.items).length && !Object.keys(S.txns).length;
    const raw = lsGet(LS_KEY);
    if (!empty || !raw) return;
    let d; try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || !((d.settings && d.settings.anchor) || (d.items && Object.keys(d.items).length))) return;
    replaceAll(d).then(() => { lsDel(LS_KEY); toast('Moved the budget saved on this device into your synced account.'); });
  }

  function canWrite() {
    if (MODE === 'cache') { toast('You are offline. Reconnect to make changes.'); return false; }
    return MODE === 'local' || MODE === 'sync';
  }
  function writeFail(e) {
    const c = e && e.code;
    if (c === 'permission-denied') toast('Sync refused that change. Check the Firestore rules in your Firebase project.');
    else if (c === 'resource-exhausted') toast('Your free Firebase quota is used up for today. Changes will sync tomorrow.');
    else if (c === 'unauthenticated') toast('You were signed out. Sign in again from Settings.');
    else toast('Could not save that change. Check your connection.');
  }
  function enqueue(fn) {
    Store.pending++; syncChip();
    let p;
    try { p = Promise.resolve(fn()); } catch (e) { p = Promise.reject(e); }
    return p.catch(writeFail).finally(() => { Store.pending--; syncChip(); });
  }
  function toFs(v) {
    const F = FBX.F;
    if (v === null) return F.deleteField();
    if (v && typeof v === 'object' && !Array.isArray(v)) { const r = {}; for (const k in v) r[k] = toFs(v[k]); return r; }
    return v;
  }
  function deepMerge(a, b) {
    for (const k in b) {
      const v = b[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) a[k] = deepMerge(a[k], v);
      else a[k] = clone(v);
    }
    return a;
  }
  function saveSettings(patch) {
    if (!canWrite()) return;
    S.settings = deepMerge(clone(S.settings) || {}, patch);
    changed();
    if (MODE !== 'sync') return persistLocal();
    const R = Store.refs, F = FBX.F;
    enqueue(() => F.setDoc(R.base, toFs(clone(patch)), { merge: true }));
  }
  function saveItem(it) {
    if (!canWrite()) return;
    it = clone(it); S.items[it.id] = it; changed();
    if (MODE !== 'sync') return persistLocal();
    const R = Store.refs, F = FBX.F;
    enqueue(() => F.setDoc(F.doc(R.items, it.id), prune(it)));
  }
  function deleteItem(id) {
    if (!canWrite()) return;
    delete S.items[id]; changed();
    if (MODE !== 'sync') return persistLocal();
    const R = Store.refs, F = FBX.F;
    enqueue(() => F.deleteDoc(F.doc(R.items, id)));
  }
  function saveTxns(list, removed) {
    if (!canWrite()) return;
    const byMonth = new Map();
    const put = (m, id, v) => { if (!byMonth.has(m)) byMonth.set(m, {}); byMonth.get(m)[id] = v; };
    for (const t of removed || []) { const old = S.txns[t.id]; delete S.txns[t.id]; if (old) put(old.date.slice(0, 7), t.id, null); }
    for (const t0 of list || []) {
      const t = clone(t0);
      const old = S.txns[t.id];
      if (old && old.date.slice(0, 7) !== t.date.slice(0, 7)) put(old.date.slice(0, 7), t.id, null);
      S.txns[t.id] = t; put(t.date.slice(0, 7), t.id, t);
    }
    changed();
    if (MODE !== 'sync') return persistLocal();
    const R = Store.refs, F = FBX.F;
    for (const [m, map] of byMonth) {
      const body = {};
      for (const k in map) body[k] = map[k] === null ? null : prune(map[k]);
      enqueue(() => F.setDoc(F.doc(R.months, m), { t: toFs(body) }, { merge: true }));
    }
  }

  async function replaceAll(d) {
    if (!canWrite()) return;
    const settings = clone(d.settings || {}), its = {}, txns = {};
    const okId = s => typeof s === 'string' && /^[A-Za-z0-9_\-~:@+]{1,120}$/.test(s);
    for (const k in d.items || {}) { const it = d.items[k]; if (it && okId(it.id || k)) its[it.id || k] = Object.assign(clone(it), { id: it.id || k }); }
    for (const k in d.txns || {}) { const t = d.txns[k]; if (t && t.date && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && isFinite(+t.amount)) txns[t.id || k] = Object.assign(clone(t), { id: t.id || k }); }
    const oldItems = Object.keys(S.items);
    const oldMonths = [...new Set(Object.values(S.txns).map(t => t.date.slice(0, 7)))];
    S.settings = settings; S.items = its; S.txns = txns; changed();
    if (MODE !== 'sync') { persistLocal(); return; }
    const R = Store.refs, F = FBX.F, jobs = [];
    jobs.push(enqueue(() => F.setDoc(R.base, prune(settings))));
    for (const id of oldItems) if (!its[id]) jobs.push(enqueue(() => F.deleteDoc(F.doc(R.items, id))));
    for (const id in its) jobs.push(enqueue(() => F.setDoc(F.doc(R.items, id), prune(its[id]))));
    const months = {};
    for (const id in txns) { const m = txns[id].date.slice(0, 7); (months[m] = months[m] || {})[id] = txns[id]; }
    for (const m of oldMonths) if (!months[m]) jobs.push(enqueue(() => F.deleteDoc(F.doc(R.months, m))));
    for (const m in months) jobs.push(enqueue(() => F.setDoc(F.doc(R.months, m), { t: prune(months[m]) })));
    await Promise.all(jobs);
  }

  // ----- account actions -----
  function authMsg(e) {
    const c = (e && e.code) || '';
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'That email and password do not match. Try again, or reset your password.';
    if (/email-already-in-use/.test(c)) return 'That email already has an account. Tap Sign in instead.';
    if (/weak-password/.test(c)) return 'Use a password with at least 6 characters.';
    if (/invalid-email/.test(c)) return 'That email address does not look right.';
    if (/missing-password/.test(c)) return 'Enter your password.';
    if (/network-request-failed/.test(c)) return 'No connection. Check your internet and try again.';
    if (/too-many-requests/.test(c)) return 'Too many tries. Wait a few minutes, then try again.';
    if (/operation-not-allowed|configuration-not-found/.test(c)) return 'Email sign-in is not turned on in your Firebase project. Open Authentication, Sign-in method, and enable Email/Password.';
    if (/unauthorized-domain|requests-from-referer/.test(c)) return 'Firebase does not allow this web address yet. Add ' + location.hostname + ' under Authentication, Settings, Authorized domains.';
    if (/api-key-not-valid|invalid-api-key/.test(c)) return 'The Firebase setup code has a wrong apiKey. Remove sync setup in Settings and paste it again.';
    return 'Something went wrong (' + (c || 'unknown') + '). Try again.';
  }

  function setOv(it, rawKey, val) {
    const n = clone(it); n.ov = n.ov || {};
    if (val) n.ov[rawKey] = val; else delete n.ov[rawKey];
    saveItem(n);
  }

  // ---------------- chrome ----------------
  function syncChip() {
    for (const id of ['sync1', 'sync2']) {
      const el = document.getElementById(id); if (!el) continue;
      let cls = '', txt = 'Loading';
      const online = navigator.onLine !== false;
      if (MODE === 'sync') {
        if (Store.failed) { cls = 'local'; txt = 'Sync stopped'; }
        else if (!online) { cls = 'busy'; txt = Store.pending ? 'Offline, will sync' : 'Offline'; }
        else if (Store.pending) { cls = 'busy'; txt = 'Saving…'; }
        else { cls = 'ok'; txt = 'Synced'; }
      } else if (MODE === 'local') { cls = 'local'; txt = Store.offline ? 'Offline' : getCfg() ? 'Signed out' : 'This device only'; }
      else if (MODE === 'cache') { cls = 'local'; txt = 'Offline, view only'; }
      el.className = 'chip-sync ' + cls;
      el.querySelector('.lbl').textContent = txt;
      el.title = MODE === 'sync' ? 'Synced with your Firebase account. Changes made offline upload when you reconnect.' : MODE === 'local' ? 'Saved on this device only. Set up sync in Settings to share it with your other devices.' : '';
    }
  }
  function renderTabs() {
    const html = TABS.map(([k, l]) => `<button class="tab" data-act="tab" data-tab="${k}"${UI.tab === k ? ' aria-current="page"' : ''}>${svg(k)}<span>${l}</span></button>`).join('');
    $('#tabbar').innerHTML = html;
    $('#rail-tabs').innerHTML = html;
  }

  let rq = false, deferred = false;
  function scheduleRender() {
    if (rq) return;
    rq = true;
    const go = () => { if (!rq) return; rq = false; render(); };
    requestAnimationFrame(go); setTimeout(go, 100);
  }
  function render() {
    renderTabs(); syncChip();
    const v = $('#view');
    if (!isReady()) { v.innerHTML = '<div class="loading"><span class="spinner"></span>Opening your budget…</div>'; return; }
    const ae = document.activeElement;
    if (ae && v.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) { deferred = true; return; }
    deferred = false;
    const fn = { cal: viewCal, pay: viewPay, sched: viewSched, act: viewAct, set: viewSet }[UI.tab] || viewCal;
    v.innerHTML = fn();
  }

  function exBanner() {
    if (!items().some(i => i.example)) return '';
    return `<div class="banner"><span><strong>Example budget.</strong> Sample numbers so you can look around. Remove them when you are ready to enter your own.</span><button class="btn sm" data-act="rm-examples">Remove examples</button></div>`;
  }

  // ---------------- Calendar ----------------
  function viewCal() {
    const T = P.todayN();
    if (!UI.ym) { const a = P.ymd(T); UI.ym = { y: a.y, m: a.m }; }
    if (UI.sel == null) UI.sel = T;
    const L = ledger();
    return exBanner() + setupCard(L) + summary(L) +
      `<div class="cal-layout"><section class="card cal-card" aria-label="Calendar">${monthGrid(L)}</section><aside class="card day-panel" id="day-panel">${dayPanel(L, UI.sel)}</aside></div>`;
  }

  function setupCard(L) {
    const its = items();
    const hasBal = L.A.set, hasPay = its.some(i => i.kind === 'income' && i.paycheck), hasMore = its.some(i => i.kind !== 'income');
    if (hasBal && hasPay && hasMore) return '';
    const step = (n, done, t, d, act) => `<button class="step${done ? ' done' : ''}" data-act="${act}"><span class="n">${done ? '✓' : n}</span><span><span class="t">${t}</span><br><span class="d">${d}</span></span></button>`;
    return `<section class="card setup"><div><div class="eyebrow">Get set up</div><h2>Three steps to see every payday ahead</h2></div><div class="steps">
      ${step(1, hasBal, 'Enter your bank balance', 'What is in checking right now?', 'balance')}
      ${step(2, hasPay, 'Add your paycheck', 'Amount, how often, and your next payday', 'add-pay')}
      ${step(3, hasMore, 'Add bills and spending', 'Rent, a payment every 10 days, groceries each week', 'add-item')}
    </div>${!getCfg() && MODE === 'local' ? '<div class="row"><span class="muted" style="font-size:var(--t-sm)">Using a phone and a computer? Set up sync first so both show the same budget.</span><button class="btn sm" data-act="setup-sync">Set up sync</button></div>' : ''}${its.length ? '' : '<div class="row"><span class="muted" style="font-size:var(--t-sm)">Want to look around first?</span><button class="btn sm" data-act="examples">Load an example budget</button></div>'}</section>`;
  }

  function summary(L) {
    const T = L.today, A = L.A;
    const now = T >= A.date ? L.balAt(T) : A.balance;
    const age = T - A.date;
    const lbl = !A.set ? 'Balance today' : A.date === T ? 'Balance today' : 'Projected balance today';
    const meta = A.set ? `Bank said ${fm(A.balance)} on ${fdS(A.date)}` : 'Starting from $0 until you enter your bank balance';
    const stale = A.set && age > 7 ? `<span class="pill warn">${age} days old</span>` : '';
    const lw = L.lowest(T, T + 60);
    const lowCls = lw && lw.bal < 0 ? 'out' : lw && lw.bal < lowMark() ? 'warn' : 'in';
    const pays = P.payDates(L).filter(d => d >= T);
    let payStub = `<button class="stub" data-act="add-pay"><span class="eyebrow">Next payday</span><span class="v muted">—</span><span class="s">Add your paycheck</span></button>`;
    if (pays.length) {
      const d = pays[0];
      const amt = L.occsIn(d, d).filter(o => o.item.kind === 'income' && o.status !== 'skipped').reduce((a, o) => a + (o.status === 'paid' ? Math.abs(o.actual) : o.planned), 0);
      const days = d - T;
      payStub = `<button class="stub" data-act="goto" data-d="${d}"><span class="eyebrow">Next payday</span><span class="v in">${fmS(amt)}</span><span class="s">${d === T ? 'Today' : fdW(d) + ' · in ' + days + (days === 1 ? ' day' : ' days')}</span></button>`;
    }
    return `<section class="card summary">
      <div class="sum-main"><div class="eyebrow">${lbl}</div><div class="big${now < 0 ? ' neg' : ''}">${fm(now)}</div>
        <div class="meta"><span>${meta}</span>${stale}<button class="btn ghost sm" data-act="balance">Update</button></div></div>
      <div class="sum-row">
        <button class="stub" data-act="goto" data-d="${lw ? lw.date : T}"><span class="eyebrow">Lowest, next 60 days</span><span class="v ${lowCls}">${lw ? fm(lw.bal) : '—'}</span><span class="s">${lw ? fdW(lw.date) : ''}</span></button>
        ${payStub}
      </div></section>`;
  }

  function monthGrid(L) {
    const { y, m } = UI.ym, T = L.today;
    const first = P.fromYMD(y, m, 1), D = P.dim(y, m), ws = weekStart();
    const lead = (P.wday(first) - ws + 7) % 7;
    const marks = new Map();
    const mark = (d, k) => { if (!marks.has(d)) marks.set(d, new Set()); marks.get(d).add(k); };
    for (const o of L.occsIn(first, first + D - 1)) if (o.status !== 'skipped') mark(o.date, barOf(o.item.kind));
    for (const t of L.txns) { const d = P.dn(t.date); if (d >= first && d < first + D && !t.match) mark(d, 'tx'); }
    const lw = lowMark();
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div class="cell blank" aria-hidden="true"></div>';
    for (let d = 1; d <= D; d++) {
      const n = first + d - 1;
      const b = n >= L.A.date ? L.balAt(n) : null;
      const cls = ['cell'];
      if (n < T) cls.push('past');
      if (n === T) cls.push('today');
      if (n === UI.sel) cls.push('sel');
      if (b != null && b < 0) cls.push('neg'); else if (b != null && b < lw) cls.push('low');
      const mk = marks.get(n);
      const dots = mk ? ['in', 'out', 'sp', 'tx'].filter(k => mk.has(k)).map(k => `<i class="dot ${k}"></i>`).join('') : '';
      cells += `<button class="${cls.join(' ')}" data-act="day" data-d="${n}" aria-label="${fdL(n)}${b != null ? ', balance ' + fm(b) : ''}"><span class="dn">${d}</span><span class="dots">${dots}</span><span class="cb">${b != null ? fmC(b) : ''}</span></button>`;
    }
    const tail = (7 - ((lead + D) % 7)) % 7;
    for (let i = 0; i < tail; i++) cells += '<div class="cell blank" aria-hidden="true"></div>';
    const wk = Array.from({ length: 7 }, (_, i) => `<span>${WDS[(i + ws) % 7].slice(0, 2)}</span>`).join('');
    return `<div class="cal-head"><h2>${P.MO[m - 1]} ${y}</h2>
      <button class="btn sm" data-act="today">Today</button>
      <button class="iconbtn" data-act="mprev" aria-label="Previous month">${svg('left')}</button>
      <button class="iconbtn" data-act="mnext" aria-label="Next month">${svg('right')}</button></div>
      <div class="wk">${wk}</div><div class="grid">${cells}</div>
      <div class="legend"><span><i class="dot in"></i>Money in</span><span><i class="dot out"></i>Bill</span><span><i class="dot sp"></i>Spending budget</span><span><i class="dot tx"></i>Logged</span><span><i class="sw low"></i>Under ${fm(lw)}</span><span><i class="sw neg"></i>Below $0</span></div>`;
  }

  function dayPanel(L, d) {
    const e = L.dayEntries(d);
    const b = d >= L.A.date ? L.balAt(d) : null;
    let rows = '';
    for (const o of e.occs) rows += occRow(o, L, d, false);
    for (const t of e.txns) rows += txnRow(t, L, false);
    const tag = d === L.today ? 'Today' : d < L.today ? 'Past' : 'Ahead';
    const eod = b != null
      ? `<div class="eod"><span class="muted">End-of-day balance</span><span class="v ${b < 0 ? 'out' : b < lowMark() ? 'warn' : ''}">${fm(b)}</span></div>`
      : `<div class="eod"><span class="muted">Before your balance date (${fdS(L.A.date)})</span><span></span></div>`;
    return `<div class="eyebrow">${tag}</div><h3>${fdL(d)}</h3>${eod}` +
      (rows ? `<div class="reg">${rows}</div>` : '<p class="note">Nothing scheduled or logged on this day.</p>') +
      `<div class="panel-acts"><button class="btn primary" data-act="add-txn" data-d="${d}">${svg('plus')}Log spending</button><button class="btn" data-act="add-item" data-d="${d}">Schedule something</button></div>`;
  }

  function occRow(o, L, viewDay, showDate) {
    const it = o.item, k = it.kind;
    const meta = [];
    let amt, cls = '';
    if (showDate) meta.push(`<span>${fdW(o.date)}</span>`);
    if (k === 'spend') {
      if (o.reserve && o.countDate === viewDay && o.date !== viewDay) {
        meta.push(`<span>Rest of the ${fdS(o.date)} budget</span>`);
        amt = -o.reserve;
      } else {
        if (o.status !== 'skipped') meta.push(`<span>Spent ${fm(o.spent || 0)} of ${fm(o.planned)}</span>`);
        if (o.over) meta.push(`<span class="pill out">Over ${fm(o.over)}</span>`);
        amt = -o.planned;
        if (o.status === 'past' || (o.status === 'active' && !showDate)) cls = 'dim';
      }
    } else {
      amt = o.sign * (o.status === 'paid' ? Math.abs(o.actual) : o.planned);
      const word = k === 'income' ? 'received' : 'paid';
      if (o.status === 'paid' && o.txn) meta.push(`<span class="pill in">${k === 'income' ? 'Received' : 'Paid'} ${fdS(P.dn(o.txn.date))}</span>`);
      else if (o.status === 'due') meta.push(`<span class="pill warn">Not marked ${word}</span>`);
      else if (o.status === 'past') meta.push('<span>Before balance date</span>');
      if (o.status === 'past' || o.status === 'paid') cls = 'dim';
    }
    if (o.status === 'skipped') { cls = 'skip'; meta.push('<span class="pill">Skipped</span>'); }
    if (o.moved) meta.push(`<span class="pill acc">Moved from ${fdS(P.adjust(o.raw, P.normRule(it.rule).weekend))}</span>`);
    else if (o.shifted) meta.push(`<span>Weekend, moved from ${fdS(o.raw)}</span>`);
    if (o.changed) meta.push('<span>Amount changed once</span>');
    if (it.paycheck) meta.unshift('<span class="pill in">Payday</span>');
    return `<button class="entry ${cls}" data-act="occ" data-key="${esc(o.key)}"><span class="bar ${barOf(k)}"></span><span style="min-width:0"><span class="nm" style="display:block">${esc(it.name)}</span><span class="mt">${meta.join('')}</span></span><span class="am${amt > 0 ? ' in' : ''}">${fmS(amt)}</span></button>`;
  }

  function txnRow(t, L, showDate) {
    const it = t.item ? S.items[t.item] : null;
    const meta = [];
    if (showDate) meta.push(`<span>${fdW(P.dn(t.date))}</span>`);
    meta.push(it ? `<span class="pill ${it.kind === 'income' ? 'in' : it.kind === 'bill' ? 'out' : 'acc'}">${esc(it.name)}</span>` : '<span class="pill">Uncategorized</span>');
    if (t.match) {
      const o = L.occs.find(x => x.key === t.match);
      if (o) meta.push(`<span>${o.item.kind === 'income' ? 'Deposit for' : 'Pays the'} ${fdS(o.date)} ${o.item.kind === 'income' ? 'payday' : 'bill'}</span>`);
    }
    if (t.src === 'csv') meta.push('<span>From bank file</span>');
    if (!showDate && P.dn(t.date) === L.A.date && !L.counted.has(t.id)) meta.push('<span>Already in your balance</span>');
    const a = +t.amount;
    return `<button class="entry" data-act="txn" data-id="${esc(t.id)}"><span class="bar ${a > 0 ? 'in' : ''}"></span><span style="min-width:0"><span class="nm" style="display:block">${esc(t.desc || (it ? it.name : 'Transaction'))}</span><span class="mt">${meta.join('')}</span></span><span class="am${a > 0 ? ' in' : ''}">${fmS(a)}</span></button>`;
  }

  // ---------------- Paychecks ----------------
  function viewPay() {
    const L = ledger(), T = L.today;
    const pays = P.payDates(L);
    const head = `<div class="page-head"><h1>Paycheck plan</h1><div class="acts"><button class="btn" data-act="add-item">${svg('plus')}Add bill or budget</button></div><p class="sub">Each paycheck covers the bills and spending due before the next one comes in. Tap a bill to pay it from a different paycheck or change it this one time.</p></div>`;
    if (!pays.length) return exBanner() + head + '<div class="card empty"><h2>No paycheck yet</h2><p>Add your paycheck and how often it comes. Every payday starts a new pay period here.</p><button class="btn primary" data-act="add-pay">Add paycheck</button></div>';
    let ci = -1;
    for (let i = 0; i < pays.length; i++) if (pays[i] <= T) ci = i;
    let pre = '';
    if (ci < 0) { pre = periodCard(P.periodDetail(L, T, pays[0] - 1, pays[0]), L, { pre: true }); ci = 0; }
    const from = Math.max(0, ci - (UI.showPast ? 4 : 0));
    const to = Math.min(pays.length - 1, ci + 9);
    let cards = '';
    for (let i = from; i < to; i++) cards += periodCard(P.periodDetail(L, pays[i], pays[i + 1] - 1, pays[i + 1]), L, { cur: pays[i] <= T && pays[i + 1] > T });
    const more = ci > 0 ? `<div class="row" style="margin-bottom:var(--s3)"><button class="btn sm" data-act="toggle-past">${UI.showPast ? 'Hide earlier paychecks' : 'Show earlier paychecks'}</button></div>` : '';
    return exBanner() + head + more + `<div class="periods">${pre}${cards}</div>`;
  }

  function periodCard(p, L, opt) {
    const T = L.today;
    const title = opt.pre ? 'Before your next paycheck' : 'Paycheck ' + fdW(p.start);
    const tag = opt.cur ? '<span class="pill acc">Now</span>' : opt.pre ? '<span class="pill acc">Now</span>' : p.end < T ? '<span class="pill">Done</span>' : '';
    const sec = (label, list, total, sign) => list.length ? `<div class="p-sec"><div class="ttl"><span>${label}</span><span class="num">${fmS(sign * total)}</span></div>${list.map(o => occRow(o, L, o.date, true)).join('')}</div>` : '';
    let body = sec('Coming in', p.inc, p.income, 1) + sec('Bills', p.bills, p.billTotal, -1) + sec('Spending budgets', p.spend, p.spendTotal, -1);
    if (p.other.length) body += `<div class="p-sec"><div class="ttl"><span>Other logged</span><span class="num">${fmS(p.otherIn - p.otherOut)}</span></div><p class="note" style="padding:6px 0 0">${p.other.length} uncategorized ${p.other.length === 1 ? 'transaction' : 'transactions'}. They already count in the balances below.</p></div>`;
    if (!body) body = '<p class="note">Nothing scheduled in this period.</p>';
    let total;
    if (opt.pre) total = `<div class="p-total"><span class="lbl">Due before payday</span><span class="v">${fm(p.billTotal + p.spendTotal)}</span></div>`;
    else {
      const lbl = p.left > 0.004 ? 'Left to budget' : p.left < -0.004 ? 'Over budget' : 'Every dollar has a job';
      total = `<div class="p-total"><span class="lbl">${lbl}</span><span class="v ${p.left < -0.004 ? 'out' : p.left > 0.004 ? 'in' : ''}">${fm(Math.abs(p.left))}</span></div>`;
      if (p.left < -0.004 && p.low) {
        total += p.low.bal >= 0
          ? `<p class="p-why">This paycheck alone does not cover it, but money already in the account does. Your balance stays at or above ${fm(p.low.bal)}.</p>`
          : `<p class="p-why">Your balance would drop below $0 on ${fdS(p.low.date)}. Move a bill to another paycheck or trim a spending budget.</p>`;
      } else if (p.left > 0.004) total += '<p class="p-why">Give these dollars a job: add savings, extra debt payments or giving to this paycheck.</p>';
    }
    const bc = v => (v == null ? '' : v < 0 ? 'neg' : v < lowMark() ? 'low' : '');
    const bv = v => (v == null ? '—' : fm(v));
    const startNow = p.balStart == null && p.start <= L.A.date && p.end >= L.A.date;
    const sv = startNow ? L.A.balance : p.balStart;
    const bal = `<div class="p-bal"><div>${startNow ? 'Now' : 'Starts'}<b class="${bc(sv)}">${bv(sv)}</b></div><div>Lowest${p.low ? ' ' + fdS(p.low.date) : ''}<b class="${bc(p.low && p.low.bal)}">${bv(p.low && p.low.bal)}</b></div><div>Ends<b class="${bc(p.balEnd)}">${bv(p.balEnd)}</b></div></div>`;
    return `<article class="card period${opt.cur || opt.pre ? ' cur' : ''}"><div class="p-head"><div><h3>${title}</h3><div class="rng">${fdS(p.start)} – ${fdS(p.end)}</div></div>${tag}</div>${body}${total}${bal}</article>`;
  }

  // ---------------- Schedule ----------------
  function viewSched() {
    const T = P.todayN();
    const its = items();
    const pm = k => its.filter(i => i.kind === k).reduce((a, i) => a + P.perMonth(i.rule) * (+i.amount || 0), 0);
    const inc = pm('income'), out = pm('bill') + pm('spend');
    const head = `<div class="page-head"><h1>Schedule</h1><div class="acts"><button class="btn primary" data-act="add-item">${svg('plus')}Add</button></div><p class="sub">Everything that repeats, each on its own rhythm: every week, every 3 weeks, a set day of the month, the 2nd Tuesday, twice a month, yearly, or one time.</p></div>`;
    const avg = its.length ? `<div class="card avg"><div><div class="eyebrow">In, per month</div><div class="v in">${fm(inc)}</div></div><div><div class="eyebrow">Out, per month</div><div class="v">${fm(out)}</div></div><div><div class="eyebrow">Difference</div><div class="v ${inc - out < 0 ? 'out' : 'in'}">${fmS(inc - out)}</div></div></div>` : '';
    const sec = (k, title, hint, add) => {
      const list = its.filter(i => i.kind === k).map(i => ({ i, nx: P.nextDates(i, T, 1)[0] })).sort((a, b) => (a.nx ? a.nx.date : 1e9) - (b.nx ? b.nx.date : 1e9) || a.i.name.localeCompare(b.i.name));
      const rows = list.map(({ i, nx }) => {
        const meta = [`<span>${esc(P.describe(i.rule))}</span>`, nx ? `<span>Next: ${nx.date === T ? 'today' : fdW(nx.date)}</span>` : '<span class="pill">Finished</span>'];
        if (nx && i.rule.end && i.rule.type !== 'once') meta.push(`<span>Ends ${fdY(P.dn(i.rule.end))}</span>`);
        if (i.paycheck) meta.unshift('<span class="pill in">Payday</span>');
        const amt = (k === 'income' ? 1 : -1) * (+i.amount || 0);
        return `<button class="entry${nx ? '' : ' dim'}" data-act="edit-item" data-id="${esc(i.id)}"><span class="bar ${barOf(k)}"></span><span style="min-width:0"><span class="nm" style="display:block">${esc(i.name)}</span><span class="mt">${meta.join('')}</span></span><span class="am${amt > 0 ? ' in' : ''}">${fmS(amt)}</span></button>`;
      }).join('');
      return `<section class="card"><h2><span>${title}</span><span class="num">${fm(pm(k))}<span class="muted" style="font-weight:400;font-size:var(--t-xs)"> /mo</span></span></h2>${rows || `<p class="hint">${hint}</p>`}<div class="row" style="padding:var(--s2) 0"><button class="btn ghost sm" data-act="add-item" data-kind="${k}">${svg('plus')}${add}</button></div></section>`;
    };
    return exBanner() + head + avg + `<div class="sched">${sec('income', 'Money in', 'Paychecks, side income, child support.', 'Add income')}${sec('bill', 'Bills', 'Rent, utilities, phone, car payment, savings transfers, giving.', 'Add bill')}${sec('spend', 'Spending budgets', 'Groceries, gas, eating out: money spent in many small purchases.', 'Add budget')}</div>`;
  }

  // ---------------- Activity ----------------
  function viewAct() {
    const L = ledger(), T = L.today;
    if (!UI.actYM) { const a = P.ymd(T); UI.actYM = { y: a.y, m: a.m }; }
    const { y, m } = UI.actYM;
    const key = y + '-' + String(m).padStart(2, '0');
    const list = L.txns.filter(t => t.date.slice(0, 7) === key).sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
    const tin = list.reduce((a, t) => a + (+t.amount > 0 ? +t.amount : 0), 0);
    const tout = list.reduce((a, t) => a + (+t.amount < 0 ? -t.amount : 0), 0);
    const unc = list.filter(t => !t.item).length;
    const head = `<div class="page-head"><h1>Activity</h1><div class="acts"><button class="btn" data-act="import">${svg('up')}Import bank file</button><button class="btn primary" data-act="add-txn">${svg('plus')}Log</button></div><p class="sub">What actually happened. Log purchases as you go, import your bank's CSV file, or both. Matching rows replace the planned amounts on your calendar.</p></div>`;
    const bar = `<div class="mbar"><button class="iconbtn" data-act="aprev" aria-label="Previous month">${svg('left')}</button><h2>${P.MO[m - 1]} ${y}</h2><button class="iconbtn" data-act="anext" aria-label="Next month">${svg('right')}</button><div class="tot"><span class="in">In ${fm(tin)}</span><span>Out ${fm(tout)}</span></div></div>`;
    if (!list.length) return exBanner() + head + bar + `<div class="card empty"><h2>Nothing logged in ${P.MO[m - 1]}</h2><p>Log a purchase, or import the CSV file from your bank's website. Purchases you assign to a spending budget come out of that budget.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="add-txn">Log a purchase</button><button class="btn" data-act="import">Import bank file</button></div></div>`;
    let html = '', cur = '';
    for (const t of list) {
      if (t.date !== cur) { cur = t.date; html += `<div class="dhead">${fdW(P.dn(t.date))}</div>`; }
      html += txnRow(t, L, false);
    }
    const uncNote = unc ? `<p class="note" style="padding-top:0">${unc} without a category. Tap one to assign it; Payday Ledger remembers the choice for future imports.</p>` : '';
    return exBanner() + head + bar + uncNote + `<div class="card act-list">${html}</div>`;
  }

  // ---------------- Settings ----------------
  function viewSet() {
    const L = ledger(), A = L.A;
    const rules = rulesMap();
    const ruleRows = Object.keys(rules).sort().map(k => { const it = S.items[rules[k]]; return `<div class="r"><code>${esc(k)}</code><span>→ ${esc(it ? it.name : 'Deleted item')}</span><button class="btn sm" data-act="del-rule" data-k="${esc(k)}">Remove</button></div>`; }).join('');
    const hasEx = items().some(i => i.example);
    const cfg = getCfg();
    let sync;
    if (MODE === 'sync') sync = `<p>Signed in as <b>${esc(USER && USER.email)}</b>. Your budget syncs between your phone and computer through your own Firebase project. It also works offline and catches up when you reconnect.</p>
        <div class="row"><button class="btn primary" data-act="connect-device">Add your phone or another device</button><button class="btn" data-act="sign-out">Sign out</button></div>`;
    else if (MODE === 'cache') sync = '<p>You are offline, so this shows your last synced budget. Changes are paused until the app can reach Firebase again.</p><div class="row"><button class="btn" data-act="reload">Try again</button></div>';
    else if (Store.offline) sync = '<p>The app could not reach sync, so it is showing what is saved on this device. Connect to the internet and try again.</p><div class="row"><button class="btn primary" data-act="reload">Try again</button></div>';
    else if (cfg) sync = `<p>Sync is set up on this device, but you are signed out. Sign in to see your synced budget.</p>
        <div class="row"><button class="btn primary" data-act="sign-in">Sign in</button><button class="btn" data-act="remove-sync">Remove sync setup</button></div>`;
    else sync = `<p>Your budget is saved on this device only. Set up free sync to use the same budget on your phone and your computer.</p>
        <div class="row"><button class="btn primary" data-act="setup-sync">Set up sync</button></div>`;
    const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
    const install = standalone ? '' : `<section class="card set-card"><h2>Install as an app</h2>
        <p>On Android, open Chrome's ⋮ menu and tap <b>Add to Home screen</b> or <b>Install app</b>. On a computer, click the install icon at the right end of the address bar in Chrome or Edge.</p>
        ${installEvt ? '<div class="row"><button class="btn primary" data-act="install">Install Payday Ledger</button></div>' : ''}</section>`;
    return `<div class="page-head"><h1>Settings</h1></div><div class="set-grid">
      <section class="card set-card"><h2>Sync</h2>${sync}</section>
      ${install}
      <section class="card set-card"><h2>Bank balance</h2>
        <p>${A.set ? `${fm(A.balance)} as of ${fdY(A.date)}.` : 'Not set yet.'} The calendar figures every future day forward from this number. Update it whenever you check your bank so the projection stays exact.</p>
        <div class="row"><button class="btn primary" data-act="balance">Update balance</button></div></section>
      <section class="card set-card"><h2>Calendar</h2>
        <div class="two"><div class="fld"><label for="set-low">Warn me when a day drops below</label><input class="inp money" id="set-low" inputmode="decimal" value="${lowMark().toFixed(2)}"></div>
        <div class="fld"><label for="set-ws">Weeks start on</label><select class="inp" id="set-ws"><option value="0"${weekStart() === 0 ? ' selected' : ''}>Sunday</option><option value="1"${weekStart() === 1 ? ' selected' : ''}>Monday</option></select></div></div></section>
      <section class="card set-card"><h2>Backup</h2><p>Save a copy of everything as a file, or bring one back. Handy before big changes.</p>
        <div class="row"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="restore">Restore from backup</button></div></section>
      <section class="card set-card"><h2>Automatic categories</h2>
        <p>When you give a transaction a category, its description is remembered here. Future bank imports with the same description get that category on their own.</p>
        ${ruleRows ? `<div class="rules">${ruleRows}</div>` : ''}</section>
      <section class="card set-card"><h2>Example budget</h2><p>${hasEx ? 'Example items are loaded. Remove them to start clean; anything you added stays.' : 'Load sample bills, a paycheck and spending budgets to see how the app works.'}</p>
        <div class="row">${hasEx ? '<button class="btn" data-act="rm-examples">Remove examples</button>' : '<button class="btn" data-act="examples">Load example budget</button>'}</div></section>
      <section class="card set-card"><h2>Start over</h2><p>Erase your balance, schedule and every transaction. Export a backup first if you might want them back.</p>
        <div class="row"><button class="btn danger" data-act="erase">Erase everything</button></div></section>
    </div>`;
  }

  // ---------------- sheets ----------------
  let sheetCleanup = null;
  function openSheet(title, html, mount, wide) {
    const sh = $('#sheet');
    $('#sheet-title').textContent = title;
    $('#sheet-body').innerHTML = html;
    $('#sheet-panel').className = 'sheet-panel' + (wide ? ' wide' : '');
    sh.hidden = false; document.body.classList.add('noscroll');
    $('#sheet-panel').scrollTop = 0;
    if (mount) mount($('#sheet-body'));
    setTimeout(() => { try { $('#sheet-panel').focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 0);
  }
  function closeSheet() {
    $('#sheet').hidden = true; $('#sheet-body').innerHTML = ''; document.body.classList.remove('noscroll');
    if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
    if (deferred) render();
  }
  const showErr = (id, msg) => { const e = $(id); if (!e) return; e.textContent = msg; e.hidden = !msg; };

  function confirmSheet(title, text, label, fn) {
    openSheet(title, `<div class="form"><p style="margin:0">${text}</p><div class="sheet-acts"><button type="button" class="btn push" data-act="close">Cancel</button><button type="button" class="btn danger" id="cf-ok">${esc(label)}</button></div></div>`, () => {
      $('#cf-ok').addEventListener('click', () => { closeSheet(); fn(); });
    });
  }

  // ----- schedule item -----
  const FREQS = [['once', 'One time'], ['w1', 'Every week'], ['w2', 'Every 2 weeks'], ['w3', 'Every 3 weeks'], ['wN', 'Every X weeks (pick the number)'], ['dN', 'Every X days (like every 10 days)'], ['mDay', 'Monthly, on a date'], ['m2x', 'Twice a month'], ['mWk', 'Monthly, on a weekday (2nd Tuesday…)'], ['yearly', 'Yearly']];
  function ruleToFreq(r) {
    r = P.normRule(r);
    switch (r.type) {
      case 'once': return 'once';
      case 'weeks': return r.every === 1 ? 'w1' : r.every === 2 ? 'w2' : r.every === 3 ? 'w3' : 'wN';
      case 'days': return 'dN';
      case 'twiceMonthly': return 'm2x';
      case 'monthlyWeekday': return 'mWk';
      case 'yearly': return 'yearly';
      default: return 'mDay';
    }
  }
  const KH = {
    income: 'A paycheck or any other money coming in.',
    bill: 'A set amount paid once each time: rent, phone, car payment, a haircut, a savings transfer.',
    spend: 'Money spent in many small purchases, like groceries or gas. Purchases you log under it come out of this amount instead of adding to it.'
  };

  function openItem(item, preset) {
    preset = preset || {};
    const T = P.todayN(), isNew = !item;
    const it = item ? clone(item) : { id: newId(), kind: preset.kind || 'bill', name: preset.name || '', amount: '', paycheck: !!preset.paycheck, created: Date.now(), rule: { type: 'monthly', start: P.ds(preset.start != null ? preset.start : T) } };
    if (isNew && preset.freq === 'w2') it.rule = { type: 'weeks', every: 2, start: it.rule.start };
    if (isNew && preset.kind === 'spend') it.rule = { type: 'weeks', every: 1, start: it.rule.start };
    const r = P.normRule(it.rule);
    const freq = ruleToFreq(r);
    const st = P.dn(r.start), sy = P.ymd(st);
    const day = r.day != null && r.day !== '' ? +r.day : sy.d;
    const nth = r.nth != null ? +r.nth : (sy.d > 28 ? -1 : Math.ceil(sy.d / 7));
    const wd = r.weekday != null ? +r.weekday : P.wday(st);
    const days = r.days || [1, 15];
    const dayOpts = sel => `<option value="0"${sel === 0 ? ' selected' : ''}>Last day of the month</option>` + Array.from({ length: 31 }, (_, i) => i + 1).map(i => `<option value="${i}"${sel === i ? ' selected' : ''}>${P.ord(i)}</option>`).join('');
    const html = `<form class="form" id="f-item" novalidate>
      <div class="segm" role="radiogroup" aria-label="Type">${['income', 'bill', 'spend'].map(v => `<input type="radio" name="kind" id="k-${v}" value="${v}"${it.kind === v ? ' checked' : ''}><label for="k-${v}">${KIND_LABEL[v]}</label>`).join('')}</div>
      <p class="hint muted" id="kind-hint" style="margin:-8px 0 0;font-size:var(--t-xs)"></p>
      <div class="two"><div class="fld"><label for="f-name">Name</label><input class="inp" id="f-name" autocomplete="off" value="${esc(it.name)}" placeholder="Rent"></div>
        <div class="fld"><label for="f-amt">Amount</label><input class="inp money" id="f-amt" inputmode="decimal" autocomplete="off" value="${it.amount === '' ? '' : (+it.amount).toFixed(2)}" placeholder="0.00"></div></div>
      <div class="fld"><label for="f-freq">How often</label><select class="inp" id="f-freq">${FREQS.map(([v, l]) => `<option value="${v}"${v === freq ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="fld" id="w-every"><label for="f-every">Repeat every</label><div class="inline"><input class="inp" id="f-every" type="number" min="1" max="999" inputmode="numeric" value="${r.every}"><span id="every-unit" class="muted">weeks</span></div></div>
      <div class="fld" id="w-mday"><label for="f-mday">Day of the month</label><select class="inp" id="f-mday">${dayOpts(day)}</select><span class="hint">In shorter months it lands on the last day.</span></div>
      <div class="two" id="w-m2x"><div class="fld"><label for="f-d1">First day</label><select class="inp" id="f-d1">${dayOpts(+days[0])}</select></div><div class="fld"><label for="f-d2">Second day</label><select class="inp" id="f-d2">${dayOpts(+days[1])}</select></div></div>
      <div class="two" id="w-mwk"><div class="fld"><label for="f-nth">Which one</label><select class="inp" id="f-nth">${[[1, '1st'], [2, '2nd'], [3, '3rd'], [4, '4th'], [-1, 'Last']].map(([v, l]) => `<option value="${v}"${v === nth ? ' selected' : ''}>${l}</option>`).join('')}</select></div><div class="fld"><label for="f-wd">Weekday</label><select class="inp" id="f-wd">${P.WD.map((w, i) => `<option value="${i}"${i === wd ? ' selected' : ''}>${w}</option>`).join('')}</select></div></div>
      <div class="fld"><label for="f-start" id="start-lbl">Next date</label><input class="inp" type="date" id="f-start" value="${esc(r.start)}"><span class="hint" id="start-hint"></span></div>
      <div class="fld" id="w-weekend"><label for="f-wkend">If it lands on a weekend</label><select class="inp" id="f-wkend">${[['none', 'Keep the date'], ['before', 'Move to the Friday before'], ['after', 'Move to the Monday after'], ['nearest', 'Move to the nearest weekday']].map(([v, l]) => `<option value="${v}"${v === r.weekend ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
      <label class="check" id="w-hasend"><input type="checkbox" id="f-hasend"${r.end ? ' checked' : ''}><span>It stops after a certain date</span></label>
      <div class="fld" id="w-end"><label for="f-end">Last date</label><input class="inp" type="date" id="f-end" value="${esc(r.end || '')}"></div>
      <label class="check" id="w-pay"><input type="checkbox" id="f-pay"${it.paycheck ? ' checked' : ''}><span><b>This is a paycheck.</b> Each date starts a new pay period on the Paychecks page.</span></label>
      ${!isNew ? `<div class="box"><label class="check"><input type="checkbox" id="f-fromon"><span>Only change dates from a certain day on, and keep earlier ones as they were (for example, rent goes up in January)</span></label><div class="fld" id="w-from" hidden><label for="f-from">Starting</label><input class="inp" type="date" id="f-from" value="${P.ds(T)}"></div></div>` : ''}
      <div class="preview" id="f-prev"></div>
      <p class="err" id="f-err" hidden></p>
      <div class="sheet-acts" id="f-acts">${!isNew ? '<button type="button" class="btn danger" id="f-del">Delete</button>' : ''}<button type="button" class="btn push" data-act="close">Cancel</button><button type="submit" class="btn primary">${isNew ? 'Add' : 'Save'}</button></div>
    </form>`;
    openSheet(isNew ? 'Add to schedule' : 'Edit ' + it.name, html, () => {
      const f = $('#f-item');
      let dayTouched = !isNew, lastFreq = freq;
      const kind = () => f.querySelector('input[name=kind]:checked').value;
      function read() {
        const k = kind(), name = $('#f-name').value.trim(), amount = P.parseAmount($('#f-amt').value);
        const fq = $('#f-freq').value, start = $('#f-start').value, every = Math.floor(+$('#f-every').value);
        const rule = { start, weekend: $('#f-wkend').value };
        switch (fq) {
          case 'once': rule.type = 'once'; break;
          case 'w1': case 'w2': case 'w3': rule.type = 'weeks'; rule.every = +fq[1]; break;
          case 'wN': rule.type = 'weeks'; rule.every = every; break;
          case 'dN': rule.type = 'days'; rule.every = every; break;
          case 'mDay': rule.type = 'monthly'; rule.day = +$('#f-mday').value; rule.every = every; break;
          case 'm2x': rule.type = 'twiceMonthly'; rule.days = [+$('#f-d1').value, +$('#f-d2').value]; break;
          case 'mWk': rule.type = 'monthlyWeekday'; rule.nth = +$('#f-nth').value; rule.weekday = +$('#f-wd').value; rule.every = every; break;
          case 'yearly': rule.type = 'yearly'; rule.every = every; break;
        }
        if (fq !== 'once' && $('#f-hasend').checked && $('#f-end').value) rule.end = $('#f-end').value;
        let error = '';
        if (!start || !isFinite(P.dn(start))) error = 'Pick a date.';
        else if (['wN', 'dN', 'mDay', 'mWk', 'yearly'].includes(fq) && !(every >= 1 && every <= 999)) error = 'Enter how many to repeat every, like 3.';
        else if (rule.end && P.dn(rule.end) < P.dn(start)) error = 'The last date is before the first date.';
        else if (fq === 'm2x' && rule.days[0] === rule.days[1]) error = 'Pick two different days.';
        const out = Object.assign({}, it, { kind: k, name, amount: isFinite(amount) ? P.round2(Math.abs(amount)) : '', rule, paycheck: k === 'income' && $('#f-pay').checked });
        delete out.example;
        return { item: out, error, nameErr: !name ? 'Give it a name.' : '', amtErr: !(amount > 0) && !(amount < 0) ? 'Enter an amount, like 125.00.' : '' };
      }
      function sync() {
        const k = kind(), fq = $('#f-freq').value;
        $('#kind-hint').textContent = KH[k];
        $('#w-pay').hidden = k !== 'income';
        if (fq !== lastFreq) {
          const ev = $('#f-every');
          if (fq === 'wN' && +ev.value < 2) ev.value = 4;
          else if (fq === 'dN' && +ev.value < 2) ev.value = 10;
          else if (['mDay', 'mWk', 'yearly'].includes(fq) && !['mDay', 'mWk', 'yearly'].includes(lastFreq)) ev.value = 1;
          lastFreq = fq;
        }
        $('#w-every').hidden = !['wN', 'dN', 'mDay', 'mWk', 'yearly'].includes(fq);
        $('#every-unit').textContent = { wN: 'weeks', dN: 'days', mDay: 'months', mWk: 'months', yearly: 'years' }[fq] || '';
        $('#w-mday').hidden = fq !== 'mDay'; $('#w-m2x').hidden = fq !== 'm2x'; $('#w-mwk').hidden = fq !== 'mWk';
        $('#w-hasend').hidden = fq === 'once'; $('#w-end').hidden = fq === 'once' || !$('#f-hasend').checked;
        if ($('#f-fromon')) $('#w-from').hidden = !$('#f-fromon').checked;
        $('#start-lbl').textContent = fq === 'once' ? 'Date' : 'Next date (or any past date in the pattern)';
        const sd = P.dn($('#f-start').value);
        let h = '';
        if (isFinite(sd)) {
          if (/^w/.test(fq)) h = `Repeats on ${P.WD[P.wday(sd)]}s, counting from this date.`;
          else if (fq === 'dN') h = 'Counts from this date.';
          else if (fq === 'yearly') h = `Every ${P.MO[P.ymd(sd).m - 1]} ${P.ymd(sd).d}.`;
          else if (fq !== 'once') h = 'Starts on or after this date.';
        }
        $('#start-hint').textContent = h;
        const { item: tmp, error } = read();
        const pv = $('#f-prev');
        if (error || !isFinite(P.dn(tmp.rule.start))) { pv.innerHTML = '<span class="muted">Dates will show here.</span>'; return; }
        const nx = P.nextDates(Object.assign({}, tmp, { ov: {} }), T, 6);
        pv.innerHTML = nx.length ? `<b>${P.describe(tmp.rule)}</b><div class="dates">${nx.map(o => `<span>${fdW(o.date)}</span>`).join('')}</div>` : `<b>${P.describe(tmp.rule)}</b><div class="muted">No dates from today on.</div>`;
      }
      f.addEventListener('change', e => {
        if (['f-mday', 'f-nth', 'f-wd'].includes(e.target.id)) dayTouched = true;
        if (e.target.id === 'f-start' && !dayTouched) {
          const sd = P.dn($('#f-start').value);
          if (isFinite(sd)) { const a = P.ymd(sd); $('#f-mday').value = String(a.d); $('#f-nth').value = String(a.d > 28 ? -1 : Math.ceil(a.d / 7)); $('#f-wd').value = String(P.wday(sd)); }
        }
        sync();
      });
      f.addEventListener('input', sync);
      sync();
      if (!isNew) $('#f-del').addEventListener('click', () => {
        $('#f-acts').innerHTML = `<span style="font-size:var(--t-sm)">Delete ${esc(it.name)}? Logged transactions stay but lose this category.</span><button type="button" class="btn push" id="f-nodel">Keep it</button><button type="button" class="btn danger" id="f-yesdel">Delete</button>`;
        $('#f-nodel').addEventListener('click', () => { closeSheet(); openItem(item); });
        $('#f-yesdel').addEventListener('click', () => {
          deleteItem(it.id);
          const rm = {}; const rs = rulesMap(); for (const k in rs) if (rs[k] === it.id) rm[k] = null;
          if (Object.keys(rm).length) saveSettings({ rules: rm });
          closeSheet(); toast(`Deleted ${it.name}.`);
        });
      });
      f.addEventListener('submit', e => {
        e.preventDefault();
        const r2 = read();
        const msg = r2.nameErr || r2.amtErr || r2.error;
        if (msg) { showErr('#f-err', msg); return; }
        if (!isNew && $('#f-fromon') && $('#f-fromon').checked) splitItem(item, r2.item, P.dn($('#f-from').value));
        else saveItem(r2.item);
        closeSheet(); toast(isNew ? `Added ${r2.item.name}.` : 'Saved.');
      });
    });
  }

  function splitItem(old, edited, from) {
    if (!isFinite(from)) { saveItem(edited); return; }
    const firstNew = P.rawDates(edited.rule, from, from + 1200)[0];
    const oldStart = P.dn(P.normRule(old.rule).start);
    if (firstNew == null || from <= oldStart) { saveItem(edited); return; }
    const keep = clone(old);
    keep.rule = Object.assign({}, old.rule, { end: P.ds(from - 1) });
    if (old.rule.end && P.dn(old.rule.end) < from - 1) keep.rule.end = old.rule.end;
    const nu = clone(edited); nu.id = newId(); nu.created = Date.now();
    nu.rule = Object.assign({}, edited.rule, { start: P.ds(firstNew) });
    keep.ov = {}; nu.ov = {};
    for (const k in old.ov || {}) { if (P.dn(k) >= from) nu.ov[k] = old.ov[k]; else keep.ov[k] = old.ov[k]; }
    keep.name = old.name;
    saveItem(keep); saveItem(nu);
    const moved = [];
    for (const t of Object.values(S.txns)) {
      if (t.match && t.match.indexOf(old.id + '|') === 0 && P.dn(t.match.split('|')[1]) >= from) moved.push(Object.assign({}, t, { match: nu.id + '|' + t.match.split('|')[1], item: nu.id }));
      else if (!t.match && t.item === old.id && P.dn(t.date) >= from) moved.push(Object.assign({}, t, { item: nu.id }));
    }
    if (moved.length) saveTxns(moved);
    const rs = rulesMap(), up = {}; for (const k in rs) if (rs[k] === old.id) up[k] = nu.id;
    if (Object.keys(up).length) saveSettings({ rules: up });
  }

  // ----- one occurrence -----
  function openOcc(key) {
    const L = ledger(), T = L.today;
    const o = L.occs.find(x => x.key === key);
    if (!o) return;
    const it = o.item, k = it.kind, rawKey = P.ds(o.raw);
    const ov = (it.ov || {})[rawKey] || {};
    const sched = P.adjust(o.raw, P.normRule(it.rule).weekend);
    let status = '';
    if (k !== 'spend') {
      if (o.txn) {
        status = `<div class="box"><h3>${k === 'income' ? 'Received' : 'Paid'}</h3><div class="kv"><span>${esc(o.txn.desc || it.name)} · ${fdW(P.dn(o.txn.date))}</span><b>${fmS(+o.txn.amount)}</b></div><div class="row"><button type="button" class="btn sm" data-act="txn" data-id="${esc(o.txn.id)}">Open transaction</button><button type="button" class="btn sm" id="o-unpay">${o.txn.src === 'mark' ? 'Undo' : 'Unlink from this date'}</button></div></div>`;
      } else if (o.status !== 'skipped') {
        status = `<div class="box"><h3>${k === 'income' ? 'Mark as received' : 'Mark as paid'}</h3>
          <div class="two"><div class="fld"><label for="o-pamt">Amount</label><input class="inp money" id="o-pamt" inputmode="decimal" value="${o.planned.toFixed(2)}"></div><div class="fld"><label for="o-pdate">Date</label><input class="inp" type="date" id="o-pdate" value="${P.ds(Math.min(T, o.date))}"></div></div>
          <div class="row"><button type="button" class="btn primary" id="o-pay">${k === 'income' ? 'Mark received' : 'Mark paid'}</button></div>
          <p class="hint muted" style="margin:0;font-size:var(--t-xs)">${o.status === 'past' ? 'This date is before your balance date, so it is already counted. Marking it keeps your records complete.' : 'Logs it as a transaction, which replaces the planned amount on your calendar.'}</p></div>`;
      }
    } else if (o.status !== 'skipped') {
      const ts = (o.txns || []).slice().sort((a, b) => b.date.localeCompare(a.date));
      const addDay = Math.max(o.date, Math.min(T, o.wEnd - 1));
      status = `<div class="box"><h3>Budget for ${fdS(o.date)} – ${fdS(o.wEnd - 1)}</h3>
        <div class="kv"><span>Planned</span><b>${fm(o.planned)}</b></div><div class="kv"><span>Spent</span><b>${fm(o.spent || 0)}</b></div>
        <div class="kv"><span>${o.over ? 'Over by' : 'Left'}</span><b class="${o.over ? 'out' : 'in'}">${fm(o.over || o.left || 0)}</b></div>
        ${ts.length ? `<div class="reg">${ts.map(t => txnRow(t, L, true)).join('')}</div>` : ''}
        <div class="row"><button type="button" class="btn primary sm" data-act="add-txn" data-item="${esc(it.id)}" data-d="${addDay}">${svg('plus')}Log a purchase</button></div></div>`;
    }
    const pays = P.payDates(L);
    let moveBtns = '';
    if (k !== 'income' && pays.length) {
      let i = -1; for (let j = 0; j < pays.length; j++) if (pays[j] <= o.date) i = j;
      const prev = i >= 1 ? pays[i - 1] : null, next = i + 1 < pays.length ? pays[i + 1] : null;
      const cur = i >= 0 ? pays[i] : null;
      const opts = [];
      if (cur != null && cur !== o.date) opts.push([cur, `Pay on payday, ${fdS(cur)}`]);
      if (prev != null) opts.push([prev, `Pay from the ${fdS(prev)} paycheck`]);
      if (next != null) opts.push([next, `Pay from the ${fdS(next)} paycheck`]);
      if (opts.length) moveBtns = `<div class="row">${opts.map(([d, l]) => `<button type="button" class="btn sm" data-move="${d}">${l}</button>`).join('')}</div>`;
    }
    const hasOv = ov.amount != null || ov.date || ov.skip;
    const html = `<div class="form">
      <div class="kv"><span class="muted">${KIND_LABEL[k]} · ${esc(P.describe(it.rule))}</span><b>${fm(o.planned)}</b></div>
      ${status}
      <div class="box"><h3>Change just this one</h3>
        <div class="two"><div class="fld"><label for="o-amt">Amount</label><input class="inp money" id="o-amt" inputmode="decimal" value="${o.planned.toFixed(2)}"></div><div class="fld"><label for="o-date">Date</label><input class="inp" type="date" id="o-date" value="${P.ds(o.date)}"></div></div>
        ${moveBtns}
        <label class="check"><input type="checkbox" id="o-skip"${o.skip ? ' checked' : ''}><span>Skip this one</span></label>
        <p class="err" id="o-err" hidden></p>
        <div class="row"><button type="button" class="btn primary" id="o-save">Save change</button>${hasOv ? '<button type="button" class="btn" id="o-reset">Back to the regular schedule</button>' : ''}</div>
        <p class="hint muted" style="margin:0;font-size:var(--t-xs)">Normally ${fdW(sched)}${o.shifted ? ` (moved off the weekend from ${fdS(o.raw)})` : ''}. Other dates in the schedule stay the same.</p></div>
      <div class="sheet-acts"><button type="button" class="btn" data-act="edit-item" data-id="${esc(it.id)}">Edit the whole schedule</button></div>
    </div>`;
    openSheet(it.name + ' · ' + fdS(o.date), html, () => {
      const pay = $('#o-pay');
      if (pay) pay.addEventListener('click', () => {
        const amt = P.parseAmount($('#o-pamt').value), dt = $('#o-pdate').value;
        if (!(amt > 0) || !dt) { toast('Enter the amount and date.'); return; }
        saveTxns([{ id: newId(), date: dt, amount: P.round2(o.sign * Math.abs(amt)), desc: it.name, item: it.id, match: o.key, src: 'mark', created: Date.now() }]);
        closeSheet(); toast(k === 'income' ? 'Marked received.' : 'Marked paid.');
      });
      const un = $('#o-unpay');
      if (un) un.addEventListener('click', () => {
        if (o.txn.src === 'mark') saveTxns([], [o.txn]); else saveTxns([Object.assign({}, o.txn, { match: null })]);
        closeSheet(); toast('Done.');
      });
      $$('[data-move]').forEach(b => b.addEventListener('click', () => {
        const d = +b.dataset.move;
        const nv = Object.assign({}, ov); delete nv.skip;
        if (d === sched) delete nv.date; else nv.date = P.ds(d);
        setOv(it, rawKey, Object.keys(nv).length ? nv : null);
        closeSheet(); toast(`${it.name} moved to ${fdS(d)}.`);
      }));
      $('#o-save').addEventListener('click', () => {
        const amt = P.parseAmount($('#o-amt').value), dt = $('#o-date').value, skip = $('#o-skip').checked;
        if (!(amt >= 0) || !dt) { showErr('#o-err', 'Enter an amount and a date.'); return; }
        const nv = {};
        if (Math.abs(amt - (+it.amount || 0)) > 0.004) nv.amount = P.round2(amt);
        if (P.dn(dt) !== sched) nv.date = dt;
        if (skip) nv.skip = true;
        setOv(it, rawKey, Object.keys(nv).length ? nv : null);
        closeSheet(); toast('Saved.');
      });
      const rs = $('#o-reset');
      if (rs) rs.addEventListener('click', () => { setOv(it, rawKey, null); closeSheet(); toast('Back on the regular schedule.'); });
    });
  }

  // ----- transaction -----
  function catOptions(sel) {
    const its = items();
    const grp = (k, label) => { const l = its.filter(i => i.kind === k).sort((a, b) => a.name.localeCompare(b.name)); return l.length ? `<optgroup label="${label}">${l.map(i => `<option value="${esc(i.id)}"${i.id === sel ? ' selected' : ''}>${esc(i.name)}</option>`).join('')}</optgroup>` : ''; };
    return `<option value="">Uncategorized</option>${grp('spend', 'Spending budgets')}${grp('bill', 'Bills')}${grp('income', 'Money in')}`;
  }

  function openTxn(t, preset) {
    preset = preset || {};
    const T = P.todayN(), isNew = !t;
    const tx = t ? clone(t) : { id: newId(), date: P.ds(preset.date != null ? preset.date : T), amount: 0, desc: '', item: preset.item || null, match: null, src: 'manual', created: Date.now() };
    const pre = tx.item && S.items[tx.item];
    const dir = +tx.amount > 0 || (isNew && pre && pre.kind === 'income') ? 'in' : 'out';
    const html = `<form class="form" id="f-tx" novalidate>
      <div class="segm" role="radiogroup" aria-label="Direction"><input type="radio" name="dir" id="d-out" value="out"${dir === 'out' ? ' checked' : ''}><label for="d-out">Money out</label><input type="radio" name="dir" id="d-in" value="in"${dir === 'in' ? ' checked' : ''}><label for="d-in">Money in</label></div>
      <div class="two"><div class="fld"><label for="t-amt">Amount</label><input class="inp money" id="t-amt" inputmode="decimal" autocomplete="off" value="${+tx.amount ? Math.abs(+tx.amount).toFixed(2) : ''}" placeholder="0.00"></div>
        <div class="fld"><label for="t-date">Date</label><input class="inp" type="date" id="t-date" value="${esc(tx.date)}"></div></div>
      <div class="fld"><label for="t-desc">Description</label><input class="inp" id="t-desc" autocomplete="off" value="${esc(tx.desc)}" placeholder="Kroger"></div>
      <div class="fld"><label for="t-cat">Category</label><select class="inp" id="t-cat">${catOptions(tx.item)}</select><span class="hint" id="t-cat-hint"></span></div>
      <div class="fld" id="w-match" hidden><label for="t-match">Which scheduled date is this for?</label><select class="inp" id="t-match"></select><span class="hint">Picking a date replaces that planned amount on your calendar with this one.</span></div>
      <p class="err" id="t-err" hidden></p>
      <div class="sheet-acts" id="t-acts">${!isNew ? '<button type="button" class="btn danger" id="t-del">Delete</button>' : ''}<button type="button" class="btn push" data-act="close">Cancel</button><button type="submit" class="btn primary">${isNew ? 'Log it' : 'Save'}</button></div>
    </form>`;
    openSheet(isNew ? 'Log a transaction' : 'Transaction', html, () => {
      const f = $('#f-tx');
      let catTouched = false;
      function refresh() {
        const it = S.items[$('#t-cat').value];
        $('#t-cat-hint').textContent = it && it.kind === 'spend' ? 'Comes out of this budget, so it does not lower your projected balance twice.' : '';
        const w = $('#w-match');
        if (!it || it.kind === 'spend') { w.hidden = true; $('#t-match').innerHTML = ''; return; }
        w.hidden = false;
        const L = ledger(); const d = P.dn($('#t-date').value); const dd = isFinite(d) ? d : T;
        const opts = L.occs.filter(o => o.item.id === it.id && !o.skip && Math.abs(o.date - dd) <= 45 && (!o.txn || o.txn.id === tx.id || o.txn.src === 'mark'));
        let sel = tx.match && opts.some(o => o.key === tx.match) ? tx.match : '';
        if (!sel && (isNew || catTouched)) {
          const free = opts.filter(o => !o.txn || o.txn.id === tx.id).sort((a, b) => Math.abs(a.date - dd) - Math.abs(b.date - dd));
          if (free.length && Math.abs(free[0].date - dd) <= 10) sel = free[0].key;
        }
        $('#t-match').innerHTML = `<option value="">None of these</option>` + opts.map(o => `<option value="${esc(o.key)}"${o.key === sel ? ' selected' : ''}>${fdW(o.date)} · ${fm(o.planned)}${o.txn && o.txn.id !== tx.id ? ' (marked paid)' : ''}</option>`).join('');
        if (!$('#t-amt').value && sel) { const o = opts.find(x => x.key === sel); if (o) $('#t-amt').value = o.planned.toFixed(2); }
      }
      $('#t-cat').addEventListener('change', () => {
        catTouched = true;
        const it = S.items[$('#t-cat').value];
        if (it) f.querySelector(`#d-${it.kind === 'income' ? 'in' : 'out'}`).checked = true;
        if (it && !$('#t-desc').value.trim()) $('#t-desc').value = it.name;
        refresh();
      });
      $('#t-date').addEventListener('change', refresh);
      $('#t-match').addEventListener('change', () => { const o = ledger().occs.find(x => x.key === $('#t-match').value); if (o && !$('#t-amt').value) $('#t-amt').value = o.planned.toFixed(2); });
      refresh();
      if (!isNew) $('#t-del').addEventListener('click', () => {
        $('#t-acts').innerHTML = `<span style="font-size:var(--t-sm)">Delete this transaction?</span><button type="button" class="btn push" data-act="close">Keep it</button><button type="button" class="btn danger" id="t-yes">Delete</button>`;
        $('#t-yes').addEventListener('click', () => { saveTxns([], [tx]); closeSheet(); toast('Deleted.'); });
      });
      f.addEventListener('submit', e => {
        e.preventDefault();
        const amt = P.parseAmount($('#t-amt').value), date = $('#t-date').value;
        if (!(Math.abs(amt) > 0)) { showErr('#t-err', 'Enter an amount, like 42.50.'); return; }
        if (!date || !isFinite(P.dn(date))) { showErr('#t-err', 'Pick a date.'); return; }
        const d = f.querySelector('input[name=dir]:checked').value;
        const cat = $('#t-cat').value || null, it = cat ? S.items[cat] : null;
        const match = it && it.kind !== 'spend' ? ($('#t-match').value || null) : null;
        const desc = $('#t-desc').value.trim();
        const nt = Object.assign({}, tx, { date, amount: P.round2(d === 'in' ? Math.abs(amt) : -Math.abs(amt)), desc: desc || (it ? it.name : ''), item: cat, match });
        if (nt.src === 'mark' && (!match || match !== tx.match)) nt.src = 'manual';
        const removed = [], relinked = [];
        if (match) for (const x of Object.values(S.txns)) if (x.match === match && x.id !== nt.id) { if (x.src === 'mark') removed.push(x); else relinked.push(Object.assign({}, x, { match: null })); }
        saveTxns([nt].concat(relinked), removed);
        if (cat && desc && cat !== (t && t.item) && nt.src !== 'mark') { const rk = P.ruleKey(desc); if (rk) saveSettings({ rules: { [rk]: cat } }); }
        closeSheet(); toast(isNew ? 'Logged.' : 'Saved.');
      });
    });
  }

  // ----- balance -----
  function openBalance() {
    const L = ledger(), T = L.today, A = L.A;
    const html = `<form class="form" id="f-bal" novalidate>
      <p class="muted" style="margin:0;font-size:var(--t-sm)">Open your bank app and enter what is in checking right now. Every future day on the calendar is figured forward from this number. Use a minus sign if the account is overdrawn.</p>
      <div class="two"><div class="fld"><label for="b-amt">Balance</label><input class="inp money" id="b-amt" inputmode="decimal" autocomplete="off" value="${A.set ? A.balance.toFixed(2) : ''}" placeholder="0.00"></div>
        <div class="fld"><label for="b-date">As of</label><input class="inp" type="date" id="b-date" value="${P.ds(T)}"></div></div>
      <div id="b-today"></div>
      <p class="err" id="b-err" hidden></p>
      <div class="sheet-acts"><button type="button" class="btn push" data-act="close">Cancel</button><button type="submit" class="btn primary">Save balance</button></div>
    </form>`;
    openSheet('Bank balance', html, () => {
      function refresh() {
        const d = P.dn($('#b-date').value), box = $('#b-today');
        if (!isFinite(d)) { box.innerHTML = ''; return; }
        const os = ledger().occs.filter(o => o.date === d && o.item.kind !== 'spend' && !o.skip && !o.txn);
        box.innerHTML = os.length ? `<div class="box"><h3>Scheduled for ${fdS(d)}</h3><p class="hint muted" style="margin:0;font-size:var(--t-xs)">Leave checked if it has already hit your account. Uncheck anything still pending so it is counted later today.</p>${os.map(o => `<label class="check"><input type="checkbox" class="b-occ" value="${esc(o.key)}" checked><span>${esc(o.item.name)} <b class="num">${fmS(o.sign * o.planned)}</b></span></label>`).join('')}</div>` : '';
      }
      $('#b-date').addEventListener('change', refresh);
      refresh();
      $('#f-bal').addEventListener('submit', e => {
        e.preventDefault();
        const v = P.parseAmount($('#b-amt').value), d = $('#b-date').value;
        if (!isFinite(v)) { showErr('#b-err', 'Enter your balance, like 1240.50.'); return; }

  function csvStep2() {
    const text = $('#c-text') ? $('#c-text').value : '';
    const rows = P.parseCSV(text);
    if (rows.length < 1) { showErr('#c-err', 'No rows found. Choose the CSV file from your bank, or paste its text.'); return; }
    const g = P.guessColumns(rows);
    CSV = { rows, map: g, mode: g.amount >= 0 || g.debit < 0 ? 'one' : 'two', sign: 'neg', fmt: null };
    if (CSV.mode === 'one' && g.amount < 0) g.amount = 0;
    const vals = rows.slice(g.headerRow + 1).map(r => P.parseAmount(r[g.amount])).filter(isFinite);
    if (CSV.mode === 'one' && vals.length && vals.every(v => v >= 0)) CSV.allPos = true;
    renderStep2();
  }
  function csvParse() {
    const { rows, map } = CSV, out = []; let bad = 0;
    for (const r of rows.slice(map.headerRow + 1)) {
      const date = P.parseDate(r[map.date], CSV.fmt === 'AUTO' ? null : CSV.fmt);
      let amt;
      if (CSV.mode === 'one') { amt = P.parseAmount(r[map.amount]); if (CSV.sign === 'pos') amt = -amt; }
      else {
        const de = P.parseAmount(r[map.debit]), cr = P.parseAmount(r[map.credit]);
        amt = !isFinite(de) && !isFinite(cr) ? NaN : (isFinite(cr) ? Math.abs(cr) : 0) - (isFinite(de) ? Math.abs(de) : 0);
      }
      const desc = map.desc >= 0 ? String(r[map.desc] || '').replace(/\s+/g, ' ').trim() : '';
      if (!date || !isFinite(amt) || Math.abs(amt) < 0.005) { bad++; continue; }
      out.push({ date, amount: P.round2(amt), desc });
    }
    return { out, bad };
  }
  function renderStep2() {
    const { rows, map } = CSV;
    const ncol = Math.max.apply(null, rows.map(r => r.length));
    const head = map.headerRow >= 0 ? rows[map.headerRow] : null;
    const cn = i => (head && head[i] ? head[i] : 'Column ' + (i + 1));
    const opt = (sel, none) => (none ? `<option value="-1"${sel < 0 ? ' selected' : ''}>(none)</option>` : '') + Array.from({ length: ncol }, (_, i) => `<option value="${i}"${i === sel ? ' selected' : ''}>${esc(cn(i))}</option>`).join('');
    if (!CSV.fmt) CSV.fmt = P.detectDateFormat(rows.slice(map.headerRow + 1).map(r => r[map.date]));
    const { out, bad } = csvParse();
    const prev = out.slice(0, 6).map(r => `<tr><td>${fdY(P.dn(r.date))}</td><td>${esc(r.desc)}</td><td class="r ${r.amount > 0 ? 'in' : ''}">${fmS(r.amount)}</td></tr>`).join('');
    const html = `<div class="form">
      <p class="muted" style="margin:0;font-size:var(--t-sm)">Check that the columns are right. The preview below should show money you spent as minus amounts.</p>
      <div class="two"><div class="fld"><label for="m-date">Date column</label><select class="inp" id="m-date">${opt(map.date)}</select></div>
        <div class="fld"><label for="m-desc">Description column</label><select class="inp" id="m-desc">${opt(map.desc, true)}</select></div></div>
      <div class="fld"><label for="m-mode">Amounts are in</label><select class="inp" id="m-mode"><option value="one"${CSV.mode === 'one' ? ' selected' : ''}>One column</option><option value="two"${CSV.mode === 'two' ? ' selected' : ''}>Two columns: money out and money in</option></select></div>
      ${CSV.mode === 'one'
        ? `<div class="two"><div class="fld"><label for="m-amt">Amount column</label><select class="inp" id="m-amt">${opt(map.amount)}</select></div><div class="fld"><label for="m-sign">Money you spent shows as</label><select class="inp" id="m-sign"><option value="neg"${CSV.sign === 'neg' ? ' selected' : ''}>Negative numbers</option><option value="pos"${CSV.sign === 'pos' ? ' selected' : ''}>Positive numbers</option></select></div></div>${CSV.allPos ? '<p class="hint warn" style="margin:0;font-size:var(--t-xs)">Every amount in this file is positive. If it is a credit card export, pick "Positive numbers".</p>' : ''}`
        : `<div class="two"><div class="fld"><label for="m-debit">Money out column</label><select class="inp" id="m-debit">${opt(map.debit, true)}</select></div><div class="fld"><label for="m-credit">Money in column</label><select class="inp" id="m-credit">${opt(map.credit, true)}</select></div></div>`}
      <div class="fld"><label for="m-fmt">Date format</label><select class="inp" id="m-fmt">${[['MDY', 'Month/Day/Year (10/17/2026)'], ['DMY', 'Day/Month/Year (17/10/2026)'], ['YMD', 'Year-Month-Day (2026-10-17)'], ['AUTO', 'Other / written out']].map(([v, l]) => `<option value="${v}"${CSV.fmt === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="kv"><span>${out.length} transactions read${bad ? ` · ${bad} rows skipped (no date or amount)` : ''}</span><b></b></div>
      ${prev ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>${prev}</tbody></table></div>` : ''}
      <p class="err" id="c-err" hidden></p>
      <div class="sheet-acts"><button type="button" class="btn" id="c-back">Back</button><button type="button" class="btn primary push" id="c-review"${out.length ? '' : ' disabled'}>Review ${out.length}</button></div></div>`;
    $('#sheet-body').innerHTML = html;
    const set = (id, fn) => { const el = $(id); if (el) el.addEventListener('change', () => { fn(el.value); renderStep2(); }); };
    set('#m-date', v => { map.date = +v; CSV.fmt = null; });
    set('#m-desc', v => { map.desc = +v; });
    set('#m-mode', v => { CSV.mode = v; if (v === 'two' && map.debit < 0) { map.debit = 0; map.credit = Math.min(1, ncol - 1); } if (v === 'one' && map.amount < 0) map.amount = 0; });
    set('#m-amt', v => { map.amount = +v; });
    set('#m-sign', v => { CSV.sign = v; });
    set('#m-debit', v => { map.debit = +v; });
    set('#m-credit', v => { map.credit = +v; });
    set('#m-fmt', v => { CSV.fmt = v; });
    $('#c-back').addEventListener('click', openCSV);
    $('#c-review').addEventListener('click', csvStep3);
  }
  function csvStep3() {
    const { out } = csvParse();
    const L = ledger();
    const exist = {};
    for (const t of Object.values(S.txns)) { const h = t.hash || P.txnHash(t.date, t.amount, t.desc); exist[h] = (exist[h] || 0) + 1; }
    const seen = {}, used = new Set(), claimed = new Set();
    const manual = Object.values(S.txns).filter(t => t.src !== 'csv');
    CSV.review = out.sort((a, b) => a.date.localeCompare(b.date)).map(r => {
      const h = P.txnHash(r.date, r.amount, r.desc);
      seen[h] = (seen[h] || 0) + 1;
      const dup = seen[h] <= (exist[h] || 0);
      const row = Object.assign({}, r, { hash: h, dup, include: !dup, item: null, match: null, replaces: null, touched: false });
      if (dup) return row;
      row.item = P.suggestItem(S, r.desc, r.amount);
      const twin = manual.find(t => !claimed.has(t.id) && Math.abs(+t.amount - r.amount) < 0.005 && Math.abs(P.dn(t.date) - P.dn(r.date)) <= 4);
      if (twin) { claimed.add(twin.id); row.replaces = twin.id; row.twin = twin.desc || 'your entry'; if (twin.item) row.item = twin.item; if (twin.match) { row.match = twin.match; used.add(twin.match); } }
      if (!row.match) {
        const o = P.suggestMatch(L, S, r, used, row.item && S.items[row.item] && S.items[row.item].kind !== 'spend' ? row.item : null) || (row.item ? null : P.suggestMatch(L, S, r, used));
        if (o) { row.match = o.key; used.add(o.key); row.item = o.item.id; }
      }
      return row;
    });
    CSV.used = used;
    renderStep3();
  }
  function renderStep3(keepScroll) {
    const R = CSV.review, A = ledger().A;
    const inc = R.filter(r => r.include);
    const dups = R.filter(r => r.dup).length, matched = inc.filter(r => r.match).length, cat = inc.filter(r => r.item).length, repl = inc.filter(r => r.replaces).length;
    const before = inc.filter(r => P.dn(r.date) <= A.date).length;
    const L = ledger();
    const row = (r, i) => {
      const o = r.match ? L.occs.find(x => x.key === r.match) : null;
      return `<div class="rv${r.include ? '' : ' off'}"><input type="checkbox" data-rv="${i}"${r.include ? ' checked' : ''} aria-label="Import this row"><span class="d">${esc(r.desc || '(no description)')}</span><span class="a${r.amount > 0 ? ' in' : ''}">${fmS(r.amount)}</span>
        <span class="x"><span>${fdS(P.dn(r.date))}</span><select data-rc="${i}" aria-label="Category">${catOptions(r.item)}</select>${o ? `<span class="pill in">${o.item.kind === 'income' ? 'Payday' : 'Pays'} ${esc(o.item.name)} · ${fdS(o.date)}</span>` : ''}${r.dup ? '<span class="pill">Already imported</span>' : ''}${r.replaces && r.include ? `<span class="pill acc">Replaces "${esc(r.twin)}" you logged</span>` : ''}</span></div>`;
    };
    const sc = $('.rv-list') ? $('.rv-list').scrollTop : 0;
    $('#sheet-body').innerHTML = `<div class="form">
      <div class="box"><div class="kv"><span>Rows in file</span><b>${R.length}</b></div>
        ${dups ? `<div class="kv"><span>Already imported (unchecked)</span><b>${dups}</b></div>` : ''}
        <div class="kv"><span>Matched to scheduled bills or paydays</span><b>${matched}</b></div>
        <div class="kv"><span>With a category</span><b>${cat} of ${inc.length}</b></div>
        ${repl ? `<div class="kv"><span>Replacing entries you logged by hand</span><b>${repl}</b></div>` : ''}</div>
      ${before ? `<p class="muted" style="margin:0;font-size:var(--t-xs)">${before} ${before === 1 ? 'row is' : 'rows are'} dated on or before your balance date (${fdS(A.date)}). Your bank balance already includes them, so they are saved for your records and budgets without lowering the projection again.</p>` : ''}
      <div class="rv-list">${R.map(row).join('')}</div>
      <div class="sheet-acts"><button type="button" class="btn" id="c-back2">Back</button><button type="button" class="btn primary push" id="c-go"${inc.length ? '' : ' disabled'}>Import ${inc.length}</button></div></div>`;
    if (keepScroll) $('.rv-list').scrollTop = sc;
    $('.rv-list').addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.rv != null) { CSV.review[+t.dataset.rv].include = t.checked; renderStep3(true); }
      else if (t.dataset.rc != null) {
        const r = CSV.review[+t.dataset.rc];
        r.item = t.value || null; r.touched = true;
        if (r.match) { CSV.used.delete(r.match); r.match = null; }
        const it = r.item && S.items[r.item];
        if (it && it.kind !== 'spend') { const o = P.suggestMatch(ledger(), S, r, CSV.used, it.id); if (o) { r.match = o.key; CSV.used.add(o.key); } }
        renderStep3(true);
      }
    });
    $('#c-back2').addEventListener('click', renderStep2);
    $('#c-go').addEventListener('click', csvImport);
  }
  function csvImport() {
    const now = Date.now(), list = [], removed = new Map(), learn = {};
    const L = ledger();
    let matched = 0;
    CSV.review.forEach((r, i) => {
      if (!r.include) return;
      const t = { id: newId() + i.toString(36), date: r.date, amount: r.amount, desc: r.desc, item: r.item || null, match: r.match || null, src: 'csv', created: now + i, hash: r.hash };
      if (r.replaces && S.txns[r.replaces]) { const old = S.txns[r.replaces]; removed.set(old.id, old); if (!t.item && old.item) t.item = old.item; if (!t.match && old.match) t.match = old.match; }
      if (t.match) { matched++; const o = L.occs.find(x => x.key === t.match); if (o && o.txn && o.txn.src === 'mark') removed.set(o.txn.id, o.txn); }
      if (r.touched && r.item && r.desc) { const k = P.ruleKey(r.desc); if (k) learn[k] = r.item; }
      list.push(t);
    });
    saveTxns(list, [...removed.values()]);
    if (Object.keys(learn).length) saveSettings({ rules: learn });
    closeSheet();
    toast(`Imported ${list.length} ${list.length === 1 ? 'transaction' : 'transactions'}${matched ? `, ${matched} matched to your schedule` : ''}.`);
    const last = list.map(t => t.date).sort().pop();
    if (last) { const a = P.ymd(P.dn(last)); UI.actYM = { y: a.y, m: a.m }; }
    setTab('act');
  }
