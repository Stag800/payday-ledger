        e.preventDefault();
        const em = $('#au-email').value.trim(), pw = $('#au-pass').value;
        if (!em || !pw) { showErr('#au-err', 'Enter your email and password.'); return; }
        const btn = $('#au-go'); btn.disabled = true;
        try {
          if (create) await FBX.Au.createUserWithEmailAndPassword(FBX.auth, em, pw);
          else await FBX.Au.signInWithEmailAndPassword(FBX.auth, em, pw);
          closeSheet(); toast('Signed in. Your budget now syncs.');
        } catch (err) { btn.disabled = false; showErr('#au-err', authMsg(err)); }
      });
    });
  }
  function openConnectDevice() {
    const link = setupLink();
    openSheet('Add your phone', `<div class="form">
      <ol class="guide">
        <li>Copy this link and send it to yourself (email or text). Open it on your phone in <b>Chrome</b>.</li>
        <li>Sign in with the same email and password${USER && USER.email ? ` (<b>${esc(USER.email)}</b>)` : ''}.</li>
        <li>In Chrome's ⋮ menu, tap <b>Add to Home screen</b> or <b>Install app</b>. It then opens from its own icon like any app.</li>
      </ol>
      <pre class="code" id="link-text">${esc(link)}</pre>
      <div class="sheet-acts"><button type="button" class="btn primary push" id="link-copy">Copy link</button></div>
      <p class="muted" style="margin:0;font-size:var(--t-xs)">The link only holds your Firebase project's public address. Your password and budget are not in it.</p>
    </div>`, () => { $('#link-copy').addEventListener('click', () => copyText(link, '#link-text')); });
  }
  async function signOutNow() {
    try { if (FBX) await FBX.Au.signOut(FBX.auth); } catch (e) { /* ignore */ }
    lsDel(CACHE_KEY);
    toast('Signed out.');
  }
  function removeSync() {
    confirmSheet('Remove sync from this device?', 'This device stops syncing and forgets your Firebase project. Your synced budget stays safe in Firebase; set up sync again to get it back.', 'Remove sync', async () => {
      await signOutNow();
      lsDel(CFG_KEY); lsDel(CACHE_KEY);
      location.reload();
    });
  }
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (UI.tab === 'set') render(); });
  window.addEventListener('appinstalled', () => { installEvt = null; toast('Installed.'); });
  window.addEventListener('online', syncChip);
  window.addEventListener('offline', syncChip);

  // ----- examples -----
  function loadExamples() {
    const T = P.todayN(), a = P.ymd(T);
    const nextWd = wd => T + ((((wd - P.wday(T)) % 7) + 7) % 7 || 7);
    const fri = nextWd(5), mon = nextWd(1), som = P.ds(P.fromYMD(a.y, a.m, 1));
    const mk = (name, kind, amount, rule, extra) => Object.assign({ id: 'ex' + newId(), name, kind, amount, rule, example: true, created: Date.now() }, extra || {});
    const list = [
      mk('Paycheck', 'income', 1850, { type: 'weeks', every: 2, start: P.ds(fri), weekend: 'before' }, { paycheck: true }),
      mk('Giving', 'bill', 185, { type: 'weeks', every: 2, start: P.ds(fri) }),
      mk('Rent', 'bill', 1250, { type: 'monthly', day: 1, start: som }),
      mk('Car payment', 'bill', 389, { type: 'monthly', day: 12, start: som }),
      mk('Electric', 'bill', 128, { type: 'monthly', day: 18, start: som, weekend: 'after' }),
      mk('Phone', 'bill', 85, { type: 'monthly', day: 22, start: som }),
      mk('Streaming', 'bill', 15.99, { type: 'monthly', day: 9, start: som }),
      mk('Haircut', 'bill', 30, { type: 'weeks', every: 3, start: P.ds(T + 5) }),
      mk('Car insurance', 'bill', 612, { type: 'monthly', day: 5, every: 6, start: P.ds(P.addMonths(P.fromYMD(a.y, a.m, 5), 1)) }),
      mk('Emergency fund', 'bill', 100, { type: 'weeks', every: 2, start: P.ds(fri + 1) }),
      mk('Groceries', 'spend', 140, { type: 'weeks', every: 1, start: P.ds(mon) }),
      mk('Gas', 'spend', 45, { type: 'weeks', every: 1, start: P.ds(mon) }),
      mk('Eating out', 'spend', 60, { type: 'weeks', every: 2, start: P.ds(fri) })
    ];
    for (const it of list) saveItem(it);
    if (!ledger().A.set) saveSettings({ anchor: { date: P.ds(T), balance: 1640, setAt: Date.now(), pending: [], example: true } });
    toast('Example budget loaded.');
  }
  function removeExamples() {
    for (const it of items()) if (it.example) deleteItem(it.id);
    if (S.settings.anchor && S.settings.anchor.example) saveSettings({ anchor: null });
    toast('Examples removed.');
  }

  // ---------------- toast ----------------
  let toastT = null;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
  }

  // ---------------- events ----------------
  function setTab(k) {
    UI.tab = k; lsSet('paydayLedger.tab', k);
    render(); window.scrollTo(0, 0);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    const d = b.dataset.d != null && b.dataset.d !== '' ? +b.dataset.d : null;
    const inSheet = !!b.closest('#sheet');
    const WRITES = ['balance', 'add-pay', 'add-item', 'edit-item', 'occ', 'txn', 'add-txn', 'import', 'examples', 'rm-examples', 'restore', 'erase', 'del-rule'];
    if (MODE === 'cache' && WRITES.includes(a)) { toast('You are offline. Reconnect to make changes.'); return; }
    switch (a) {
      case 'tab': setTab(b.dataset.tab); break;
      case 'close': closeSheet(); break;
      case 'day': {
        UI.sel = d; render();
        if (window.innerWidth < 1000) {
          const p = $('#day-panel');
          if (p) {
            const r = p.getBoundingClientRect();
            if (r.top > window.innerHeight - 120) window.scrollBy({ top: r.top - window.innerHeight + 240, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
          }
        }
        break;
      }
      case 'goto': { const y = P.ymd(d); UI.ym = { y: y.y, m: y.m }; UI.sel = d; UI.tab = 'cal'; render(); break; }
      case 'mprev': case 'mnext': {
        let { y, m } = UI.ym; m += a === 'mnext' ? 1 : -1;
        if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
        UI.ym = { y, m }; UI.sel = P.fromYMD(y, m, 1) === P.fromYMD(P.ymd(P.todayN()).y, P.ymd(P.todayN()).m, 1) ? P.todayN() : P.fromYMD(y, m, 1);
        render(); break;
      }
      case 'today': { const t = P.todayN(), y = P.ymd(t); UI.ym = { y: y.y, m: y.m }; UI.sel = t; render(); break; }
      case 'aprev': case 'anext': {
        let { y, m } = UI.actYM; m += a === 'anext' ? 1 : -1;
        if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
        UI.actYM = { y, m }; render(); break;
      }
      case 'balance': openBalance(); break;
      case 'add-pay': openItem(null, { kind: 'income', paycheck: true, name: 'Paycheck', freq: 'w2' }); break;
      case 'add-item': openItem(null, { kind: b.dataset.kind || 'bill', start: d }); break;
      case 'edit-item': if (S.items[b.dataset.id]) openItem(S.items[b.dataset.id]); break;
      case 'occ': openOcc(b.dataset.key); break;
      case 'txn': if (S.txns[b.dataset.id]) openTxn(S.txns[b.dataset.id]); break;
      case 'add-txn': openTxn(null, { date: d, item: b.dataset.item || null }); break;
      case 'import': openCSV(); break;
      case 'toggle-past': UI.showPast = !UI.showPast; render(); break;
      case 'examples': loadExamples(); break;
      case 'rm-examples': removeExamples(); break;
      case 'export': exportData(); break;
      case 'restore': openRestore(); break;
      case 'erase': confirmSheet('Erase everything?', 'This deletes your balance, every scheduled item and every transaction on all your devices. It cannot be undone.', 'Erase everything', () => { replaceAll({}).then(() => toast('Everything erased.')); }); break;
      case 'del-rule': saveSettings({ rules: { [b.dataset.k]: null } }); break;
      case 'setup-sync': openSyncSetup(); break;
      case 'reload': location.reload(); break;
      case 'sign-in': openSignIn(false); break;
      case 'sign-out': signOutNow(); break;
      case 'connect-device': openConnectDevice(); break;
      case 'remove-sync': removeSync(); break;
      case 'install': if (installEvt) { installEvt.prompt(); Promise.resolve(installEvt.userChoice).finally(() => { installEvt = null; render(); }); } break;
    }
    if (inSheet && a !== 'close' && ['txn', 'edit-item', 'add-txn'].includes(a)) { /* the new sheet replaced the old one */ }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if ((t.id === 'set-low' || t.id === 'set-ws') && MODE === 'cache') { toast('You are offline. Reconnect to make changes.'); return; }
    if (t.id === 'set-low') { const v = P.parseAmount(t.value); if (isFinite(v)) { saveSettings({ low: P.round2(v) }); toast('Saved.'); } }
    if (t.id === 'set-ws') saveSettings({ weekStart: +t.value });
  });
  $('#view').addEventListener('focusout', () => { setTimeout(() => { if (deferred) render(); }, 0); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
  let lastDay = P.todayN();
  setInterval(() => { const t = P.todayN(); if (t !== lastDay) { lastDay = t; changed(); } }, 60000);

  boot();
})();
</script>
</body>
</html>
