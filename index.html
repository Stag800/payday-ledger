<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payday Ledger</title>
<meta name="description" content="Paycheck planning and a daily balance calendar for every bill and budget.">
<meta name="theme-color" content="#E9EEE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: app shell. Left rail on wide screens, bottom tab bar on phones; panels ruled like a check register. */
:root {
  --bg: #E9EEE8; --paper: #F8FAF6; --raise: #FFFFFF; --line: #CBD6CC; --line-soft: #DFE7DE;
  --ink: #15231C; --muted: #56675D; --faint: #869489;
  --accent: #2343B0; --accent-ink: #FFFFFF; --accent-soft: #DCE3F8;
  --in: #1B7443; --in-soft: #D8EEDF; --out: #AF2F27; --out-soft: #F5DDD9; --warn: #93600F; --warn-soft: #F4E6CB;
  --scrim: rgba(13, 22, 17, .42);
  --shadow: 0 1px 0 rgba(21, 35, 28, .05), 0 10px 28px -14px rgba(21, 35, 28, .28);
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --num: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --r: 12px; --rs: 8px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --t-xs: .75rem; --t-sm: .8125rem; --t-md: .9375rem; --t-lg: 1.125rem; --t-xl: 1.5rem; --t-2xl: 2.25rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1411; --paper: #141D18; --raise: #1A251F; --line: #2C3B33; --line-soft: #202D26;
  --ink: #E2EBE4; --muted: #9AACA0; --faint: #6E8075;
  --accent: #8FA8FF; --accent-ink: #0D1411; --accent-soft: #1E2950;
  --in: #62CC90; --in-soft: #16301F; --out: #FF8D80; --out-soft: #3A1B18; --warn: #E8B45C; --warn-soft: #362A13;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1411; --paper: #141D18; --raise: #1A251F; --line: #2C3B33; --line-soft: #202D26;
  --ink: #E2EBE4; --muted: #9AACA0; --faint: #6E8075;
  --accent: #8FA8FF; --accent-ink: #0D1411; --accent-soft: #1E2950;
  --in: #62CC90; --in-soft: #16301F; --out: #FF8D80; --out-soft: #3A1B18; --warn: #E8B45C; --warn-soft: #362A13;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: var(--t-md); line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.eyebrow { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.in { color: var(--in); } .out { color: var(--out); } .warn { color: var(--warn); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.rail { display: none; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top-in { display: flex; align-items: center; gap: var(--s3); padding-block: var(--s3); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: var(--s2); font-family: var(--display); font-weight: 800; font-size: var(--t-lg); letter-spacing: -.02em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 16px; height: 16px; }
.chip-sync { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); white-space: nowrap; }
.chip-sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.chip-sync.ok .dot { background: var(--in); } .chip-sync.busy .dot { background: var(--warn); } .chip-sync.local .dot { background: var(--warn); }
main { padding-block: var(--s4) calc(88px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1120px; width: 100%; box-sizing: border-box; margin: 0 auto; min-width: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); font-weight: 500; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.2; }
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

@media (min-width: 880px) {
  .shell { grid-template-columns: 220px 1fr; }
  .rail { display: flex; flex-direction: column; gap: var(--s1); position: sticky; top: 0; height: 100vh; box-sizing: border-box; padding: var(--s5) var(--s3); padding-left: max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--paper); }
  .rail .brand { padding: 0 var(--s2) var(--s5); }
  .rail .tab { flex-direction: row; justify-content: flex-start; gap: var(--s3); font-size: var(--t-md); padding: 10px 12px; border-radius: 10px; color: var(--ink); }
  .rail .tab svg { width: 20px; height: 20px; color: var(--muted); }
  .rail .tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .rail .tab[aria-current="page"] svg { color: var(--accent); }
  .rail .chip-sync { margin: auto 0 0; align-self: flex-start; }
  .tabbar { display: none; }
  .top { display: none; }
  main { padding-block: var(--s6) var(--s6); }
}

/* ---------- common ---------- */
.page-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--s2) var(--s3); margin-bottom: var(--s4); }
.page-head h1 { font-size: var(--t-xl); font-weight: 800; }
.page-head .sub { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: var(--t-sm); max-width: 62ch; }
.page-head .acts { display: flex; gap: var(--s2); flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 520px) { .page-head { grid-template-columns: minmax(0, 1fr); } .page-head .acts { justify-content: flex-start; } }
.p-why { margin: -4px 0 0; font-size: var(--t-xs); color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--raise); padding: 8px 14px; font-weight: 600; font-size: var(--t-sm); white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--out); border-color: var(--out); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.sm { padding: 5px 10px; font-size: var(--t-xs); }
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--line-soft); color: var(--muted); white-space: nowrap; letter-spacing: .01em; }
.pill.in { background: var(--in-soft); color: var(--in); } .pill.out { background: var(--out-soft); color: var(--out); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
.banner { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); margin-bottom: var(--s4); font-size: var(--t-sm); }
.banner strong { color: var(--warn); }
.banner .btn { margin-left: auto; }
.empty { text-align: center; padding: var(--s6) var(--s4); color: var(--muted); }
.empty h2 { color: var(--ink); font-size: var(--t-lg); margin-bottom: var(--s2); }
.empty p { max-width: 46ch; margin: 0 auto var(--s4); }
.loading { padding: var(--s6) 0; color: var(--muted); display: flex; align-items: center; gap: var(--s3); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } * { scroll-behavior: auto !important; } }

/* ---------- setup ---------- */
.setup { padding: var(--s4); margin-bottom: var(--s4); display: grid; gap: var(--s3); }
.setup h2 { font-size: var(--t-lg); }
.steps { display: grid; gap: var(--s2); }
.step { display: flex; align-items: center; gap: var(--s3); padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--rs); background: var(--raise); text-align: left; width: 100%; }
.step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: var(--t-xs); font-weight: 700; background: var(--accent-soft); color: var(--accent); flex: none; }
.step.done { border-style: solid; }
.step.done .n { background: var(--in); color: var(--paper); }
.step .t { font-weight: 600; } .step .d { font-size: var(--t-sm); color: var(--muted); }

/* ---------- summary ---------- */
.summary { display: grid; grid-template-columns: 1fr; gap: 0; margin-bottom: var(--s4); overflow: hidden; }
.sum-main { padding: var(--s4); display: grid; gap: 2px; border-bottom: 1px solid var(--line); }
.sum-main .big { font-family: var(--display); font-size: var(--t-2xl); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.sum-main .big.neg { color: var(--out); }
.sum-main .meta { font-size: var(--t-sm); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.sum-row { display: grid; grid-template-columns: 1fr 1fr; }
.stub { padding: var(--s3) var(--s4); display: grid; gap: 2px; min-width: 0; background: none; border: 0; text-align: left; }
.stub + .stub { border-left: 1px solid var(--line); }
.stub .v { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: var(--t-lg); font-weight: 600; }
.stub .s { font-size: var(--t-xs); color: var(--muted); }
@media (min-width: 640px) {
  .summary { grid-template-columns: 1.3fr 2fr; }
  .sum-main { border-bottom: 0; border-right: 1px solid var(--line); }
}

/* ---------- calendar ---------- */
.cal-layout { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1000px) { .cal-layout { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); } .day-panel { position: sticky; top: var(--s5); } }
.cal-card { padding: var(--s3); }
.cal-head { display: flex; align-items: center; gap: var(--s2); padding: 2px 2px var(--s3); }
.cal-head h2 { font-size: var(--t-lg); font-weight: 700; margin-right: auto; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 18px; height: 18px; }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wk span { text-align: center; font-size: 11px; font-weight: 600; color: var(--faint); padding-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line-soft); }
.cell { position: relative; min-width: 0; aspect-ratio: 1 / 1.08; max-width: 100%; border: 0; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); background: var(--raise); padding: 4px 4px 3px; display: flex; flex-direction: column; text-align: left; overflow: hidden; }
.cell.blank { background: transparent; }
.cell .dn { font-size: 12px; font-weight: 600; line-height: 1; }
.cell .dots { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.in { background: var(--in); } .dot.out { background: var(--out); } .dot.sp { background: var(--accent); } .dot.tx { background: var(--faint); }
.cell .cb { margin-top: auto; font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 500; letter-spacing: -.01em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: clip; text-align: right; }
.cell.past { background: var(--paper); }
.cell.past .dn { color: var(--faint); }
.cell.low { background: var(--warn-soft); } .cell.low .cb { color: var(--warn); font-weight: 600; }
.cell.neg { background: var(--out-soft); } .cell.neg .cb { color: var(--out); font-weight: 600; }
.cell.today .dn { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 2px 5px; margin: -2px 0 0 -2px; align-self: flex-start; }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); z-index: 1; }
.cell:hover:not(.blank) { box-shadow: inset 0 0 0 1px var(--accent); }
.cell.sel:hover { box-shadow: inset 0 0 0 2px var(--accent); }
@media (min-width: 640px) { .cell { aspect-ratio: auto; min-height: 76px; padding: 6px; } .cell .cb { font-size: 13px; } .cell .dn { font-size: 13px; } .cell .dot { width: 7px; height: 7px; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); padding: var(--s3) 2px 0; }
.legend .dot { display: inline-block; margin-right: 5px; vertical-align: 0; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sw.low { background: var(--warn-soft); border: 1px solid var(--warn); }
.sw.neg { background: var(--out-soft); border: 1px solid var(--out); }
#rail-tabs { display: grid; gap: 2px; }

/* ---------- register lists ---------- */
.day-panel { padding: var(--s4); }
.day-panel h3 { font-size: var(--t-lg); }
.eod { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); padding: var(--s2) 0 var(--s3); border-bottom: 2px solid var(--ink); margin-bottom: var(--s1); }
.eod .v { font-family: var(--num); font-size: var(--t-lg); font-weight: 600; font-variant-numeric: tabular-nums; }
.reg { display: grid; }
.entry { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-soft); padding: 10px 2px; }
.entry:hover { background: var(--line-soft); }
.entry .bar { align-self: stretch; border-radius: 2px; background: var(--faint); }
.entry .bar.in { background: var(--in); } .entry .bar.out { background: var(--out); } .entry .bar.sp { background: var(--accent); }
.entry .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .mt { font-size: var(--t-xs); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; }
.entry .am { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.entry.dim .nm, .entry.dim .am { color: var(--muted); font-weight: 500; }
.entry.skip .nm, .entry.skip .am { text-decoration: line-through; color: var(--faint); }
.panel-acts { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s4); }
.note { font-size: var(--t-sm); color: var(--muted); padding: var(--s3) 0; }

/* ---------- paychecks ---------- */
.periods { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .periods { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.period { padding: var(--s4); display: grid; gap: var(--s3); align-content: start; }
.period.cur { border-color: var(--accent); box-shadow: var(--shadow); }
.p-head { display: flex; align-items: flex-start; gap: var(--s2); }
.p-head h3 { font-size: var(--t-lg); }
.p-head .rng { font-size: var(--t-sm); color: var(--muted); }
.p-head .pill { margin-left: auto; }
.p-sec { display: grid; }
.p-sec .ttl { display: flex; justify-content: space-between; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--muted); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.p-sec .ttl .num { letter-spacing: 0; }
.p-sec .entry { padding: 8px 2px; }
.p-total { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); padding-top: var(--s3); border-top: 2px solid var(--ink); }
.p-total .lbl { font-weight: 700; }
.p-total .v { font-family: var(--display); font-weight: 800; font-size: var(--t-xl); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.p-bal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); font-size: var(--t-xs); color: var(--muted); background: var(--raise); border-radius: var(--rs); padding: var(--s2) var(--s3); border: 1px solid var(--line-soft); }
.p-bal b { display: block; font-family: var(--num); font-size: var(--t-md); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.p-bal b.neg { color: var(--out); } .p-bal b.low { color: var(--warn); }
.pre-note { padding: var(--s3) var(--s4); font-size: var(--t-sm); }

/* ---------- schedule ---------- */
.avg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: var(--s4); }
.avg div { padding: var(--s3) var(--s4); min-width: 0; }
.avg div + div { border-left: 1px solid var(--line); }
.avg .v { font-family: var(--num); font-size: var(--t-lg); font-weight: 600; font-variant-numeric: tabular-nums; }
.sched { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .sched { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; } }
.sched section { padding: var(--s3) var(--s4) var(--s2); }
.sched h2 { font-size: var(--t-md); display: flex; justify-content: space-between; align-items: baseline; padding-bottom: var(--s2); border-bottom: 2px solid var(--ink); }
.sched h2 .num { font-family: var(--num); font-weight: 600; }
.sched .hint { font-size: var(--t-sm); color: var(--muted); padding: var(--s3) 0; }

/* ---------- activity ---------- */
.mbar { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); flex-wrap: wrap; }
.mbar h2 { font-size: var(--t-lg); min-width: 9ch; text-align: center; }
.mbar .tot { margin-left: auto; display: flex; gap: var(--s4); font-family: var(--num); font-variant-numeric: tabular-nums; font-size: var(--t-sm); }
.act-list { padding: var(--s2) var(--s4) var(--s3); }
.dhead { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--muted); padding: var(--s4) 0 4px; border-bottom: 1px solid var(--line); }

/* ---------- settings ---------- */

<div class="toast" id="toast" role="status" hidden></div>

<script>/* Payday Ledger engine: dates, schedules, projections, pay periods, CSV. Pure functions. */
(function (root) {
  'use strict';
  const DAY = 86400000;

  // ---------- dates (day numbers = days since 1970-01-01, timezone-free) ----------
  function fromYMD(y, m, d) { return Math.floor(Date.UTC(y, m - 1, d) / DAY); }
  function dn(s) {
    if (typeof s === 'number') return s;
    if (!s) return NaN;
    const p = String(s).split('-').map(Number);
    return fromYMD(p[0], p[1], p[2]);
  }
  function ds(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
  function ymd(n) { const t = new Date(n * DAY); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; }
  function wday(n) { return (((n % 7) + 7) + 4) % 7; } // 0 = Sunday
  function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function todayN() { const t = new Date(); return fromYMD(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
  function monthIdx(y, m) { return y * 12 + (m - 1); }
  function idxYM(i) { return { y: Math.floor(i / 12), m: (i % 12) + 1 }; }
  function addMonths(n, k) { const a = ymd(n); const i = monthIdx(a.y, a.m) + k; const b = idxYM(i); return fromYMD(b.y, b.m, Math.min(a.d, dim(b.y, b.m))); }

  function nthWeekday(y, m, n, wd) {
    const D = dim(y, m);
    if (n === -1 || n >= 5) { const last = fromYMD(y, m, D); return last - ((wday(last) - wd + 7) % 7); }
    const first = fromYMD(y, m, 1);
    return first + ((wd - wday(first) + 7) % 7) + 7 * (n - 1);
  }

  // ---------- recurrence ----------
  function normRule(r) {
    r = Object.assign({ type: 'once', every: 1, weekend: 'none' }, r || {});
    r.every = Math.max(1, Math.floor(+r.every || 1));
    return r;
  }

  // raw (unadjusted) dates of a rule inside [from, to]
  function rawDates(rule, from, to) {
    const r = normRule(rule);
    const start = dn(r.start);
    const out = [];
    if (!isFinite(start)) return out;
    const end = r.end ? dn(r.end) : Infinity;
    const lo = Math.max(from, start), hi = Math.min(to, end);
    if (lo > hi) return out;
    switch (r.type) {
      case 'once':
        if (start >= lo && start <= hi) out.push(start);
        break;
      case 'days':
      case 'weeks': {
        const step = r.type === 'weeks' ? 7 * r.every : r.every;
        const k = Math.ceil((lo - start) / step);
        for (let x = start + k * step; x <= hi; x += step) out.push(x);
        break;
      }
      case 'monthly':
      case 'monthlyWeekday': {
        const s = ymd(start), i0 = monthIdx(s.y, s.m);
        const l = ymd(lo), li = monthIdx(l.y, l.m);
        let k = Math.max(0, Math.floor((li - i0) / r.every) - 1);
        for (let guard = 0; guard < 5000; guard++, k++) {
          const { y, m } = idxYM(i0 + k * r.every);
          if (fromYMD(y, m, 1) > hi) break;
          let x;
          if (r.type === 'monthly') {
            const day = r.day == null || r.day === '' ? s.d : +r.day;
            const D = dim(y, m);
            x = fromYMD(y, m, day <= 0 || day > D ? D : day);
          } else {
            x = nthWeekday(y, m, r.nth == null ? 1 : +r.nth, r.weekday == null ? wday(start) : +r.weekday);
          }
          if (x >= lo && x <= hi) out.push(x);
        }
        break;
      }
      case 'twiceMonthly': {
        const days = (r.days && r.days.length ? r.days : [1, 15]).map(Number);
        const l = ymd(lo);
        for (let i = monthIdx(l.y, l.m), guard = 0; guard < 5000; i++, guard++) {
          const { y, m } = idxYM(i);
          if (fromYMD(y, m, 1) > hi) break;
          const D = dim(y, m);
          const xs = [...new Set(days.map(d => fromYMD(y, m, d <= 0 || d > D ? D : d)))].sort((a, b) => a - b);
          for (const x of xs) if (x >= lo && x <= hi) out.push(x);
        }
        break;
      }
      case 'yearly': {
        const s = ymd(start), l = ymd(lo);
        let k = Math.max(0, Math.floor((l.y - s.y) / r.every) - 1);
        for (let guard = 0; guard < 5000; guard++, k++) {
          const y = s.y + k * r.every;
          const x = fromYMD(y, s.m, Math.min(s.d, dim(y, s.m)));
          if (x > hi) break;
          if (x >= lo) out.push(x);
        }
        break;
      }
    }
    return out;
  }

  function isMember(rule, d) { return rawDates(rule, d, d).length > 0; }

  function adjust(x, mode) {
    const w = wday(x);
    if (mode === 'before') { if (w === 6) return x - 1; if (w === 0) return x - 2; }
    else if (mode === 'after') { if (w === 6) return x + 2; if (w === 0) return x + 1; }
    else if (mode === 'nearest') { if (w === 6) return x - 1; if (w === 0) return x + 1; }
    return x;
  }

  function nominalPeriod(rule) {
    const r = normRule(rule);
    switch (r.type) {
      case 'days': return r.every;
      case 'weeks': return 7 * r.every;
      case 'monthly': case 'monthlyWeekday': return Math.round(30.44 * r.every);
      case 'twiceMonthly': return 15;
      case 'yearly': return 365 * r.every;
      default: return 31;
    }
  }

  // how many times per month on average
  function perMonth(rule) {
    const r = normRule(rule);
    switch (r.type) {
      case 'days': return 365.25 / 12 / r.every;
      case 'weeks': return 365.25 / 12 / 7 / r.every;
      case 'monthly': case 'monthlyWeekday': return 1 / r.every;
      case 'twiceMonthly': return 2;
      case 'yearly': return 1 / (12 * r.every);
      default: return 0;
    }
  }

  const SIGN = { income: 1, bill: -1, spend: -1 };

  // occurrences of one item whose final date is inside [from, to]
  function itemOccs(item, from, to) {
    const r = normRule(item.rule);
    const ov = item.ov || {};
    const raws = rawDates(r, from - 7, to + 7);
    const seen = new Set(raws);
    for (const k in ov) {
      const o = ov[k];
      if (!o || !o.date) continue;
      const rd = dn(k);
      if (seen.has(rd)) continue;
      const nd = dn(o.date);
      if (nd >= from && nd <= to && isMember(r, rd)) { raws.push(rd); seen.add(rd); }
    }
    const out = [];
    for (const rd of raws) {
      const k = ds(rd);
      const o = ov[k] || null;
      let d = adjust(rd, r.weekend);
      const shifted = d !== rd;
      if (o && o.date) d = dn(o.date);
      if (d < from || d > to) continue;
      const hasAmt = o && o.amount != null && o.amount !== '' && isFinite(+o.amount);
      out.push({
        key: item.id + '|' + k, item, raw: rd, date: d,
        planned: hasAmt ? +o.amount : (+item.amount || 0),
        sign: SIGN[item.kind] || -1,
        skip: !!(o && o.skip), moved: !!(o && o.date), changed: !!hasAmt, shifted
      });
    }
    out.sort((a, b) => a.date - b.date);
    return out;
  }

  function anchorOf(st, today) {
    const a = st.settings && st.settings.anchor;
    if (a && a.date && isFinite(dn(a.date))) {
      return { date: dn(a.date), balance: +a.balance || 0, setAt: a.setAt || 0, pending: new Set(a.pending || []), set: true };
    }
    return { date: today - 1, balance: 0, setAt: 0, pending: new Set(), set: false };
  }

  // Is this transaction NOT yet reflected in the anchor balance?
  function afterAnchor(t, A) {
    const d = dn(t.date);
    if (d > A.date) return true;
    if (d < A.date) return false;
    return t.src !== 'csv' && (t.created || 0) > (A.setAt || 0);
  }

  function liveItems(st) { return Object.values(st.items || {}).filter(i => i && !i.deleted && i.id); }
  function liveTxns(st) { return Object.values(st.txns || {}).filter(t => t && t.id && t.date && isFinite(+t.amount)); }

  /**
   * Build the ledger: every occurrence with status, and daily projected balances.
   * opts: { today, from, to }  (day numbers; from/to = range the caller will look at)
   */
  function build(st, opts) {
    const today = opts.today != null ? opts.today : todayN();
    const A = anchorOf(st, today);
    const from = Math.min(opts.from != null ? opts.from : today, A.date);
    const to = Math.max(opts.to != null ? opts.to : today + 120, A.date + 1);
    const gFrom = from - 400, gTo = to + 400;
    const items = liveItems(st);
    const txns = liveTxns(st);
    const txById = new Map(txns.map(t => [t.id, t]));
    const matched = new Map();
    for (const t of txns) if (t.match) matched.set(t.match, t);

    const occs = [];
    const spendTx = new Map();
    for (const t of txns) if (t.item && !t.match) {
      if (!spendTx.has(t.item)) spendTx.set(t.item, []);
      spendTx.get(t.item).push(t);
    }

    for (const it of items) {
      const list = itemOccs(it, gFrom, gTo);
      if (it.kind === 'spend') {
        const live = list.filter(o => !o.skip);
        const period = nominalPeriod(it.rule);
        for (let i = 0; i < live.length; i++) live[i].wEnd = i + 1 < live.length ? live[i + 1].date : live[i].date + period;
        const ts = (spendTx.get(it.id) || []).slice().sort((a, b) => dn(a.date) - dn(b.date));
        for (const o of live) {
          const inW = ts.filter(t => { const d = dn(t.date); return d >= o.date && d < o.wEnd; });
          let before = 0, after = 0;
          for (const t of inW) { const v = -(+t.amount); if (afterAnchor(t, A)) after += v; else before += v; }
          o.txns = inW; o.spent = before + after;
          o.left = Math.max(o.planned - o.spent, 0); o.over = Math.max(o.spent - o.planned, 0);
          if (o.wEnd <= A.date + 1) { o.status = 'past'; o.count = 0; }
          else {
            const remaining = Math.max(o.planned - before, 0);
            const reserve = Math.min(Math.max(remaining - after, 0), remaining);
            o.count = -reserve; o.reserve = reserve;
            o.countDate = Math.max(o.date, A.date + 1);
            o.status = o.date > A.date ? 'upcoming' : 'active';
          }
        }
      }
      for (const o of list) {
        o.txn = matched.get(o.key) || null;
        if (o.skip) { o.status = 'skipped'; o.count = 0; continue; }
        if (it.kind === 'spend') continue;
        if (o.txn) { o.status = 'paid'; o.actual = +o.txn.amount; o.count = 0; continue; }
        if (o.date > A.date || (o.date === A.date && A.pending.has(o.key))) {
          o.status = o.date < today ? 'due' : 'upcoming';
          o.count = o.sign * o.planned; o.countDate = o.date;
        } else { o.status = 'past'; o.count = 0; }
      }
      occs.push(...list);
    }
    occs.sort((a, b) => a.date - b.date || a.sign - b.sign);

    // projection
    const H = to + 400;
    const n = H - A.date + 1;
    const delta = new Float64Array(n);
    const add = (d, v) => { if (d >= A.date && d <= H) delta[d - A.date] += v; };
    for (const o of occs) if (o.count) add(o.countDate, o.count);
    const counted = new Set();
    for (const t of txns) if (afterAnchor(t, A)) { add(dn(t.date), +t.amount); counted.add(t.id); }
    const bal = new Float64Array(n);
    let run = A.balance;
    for (let i = 0; i < n; i++) { run += delta[i]; bal[i] = Math.round(run * 100) / 100; }

    function balAt(d) { if (d < A.date || d > H) return null; return bal[d - A.date]; }
    function occsIn(f, t) { return occs.filter(o => o.date >= f && o.date <= t); }
    function lowest(f, t) {
      f = Math.max(f, A.date); let best = null;
      for (let d = f; d <= Math.min(t, H); d++) { const b = bal[d - A.date]; if (best === null || b < best.bal) best = { date: d, bal: b }; }
      return best;
    }
    function dayEntries(d) {
      const os = occs.filter(o => o.date === d || (o.reserve && o.countDate === d && o.date !== d));
      const ts = txns.filter(t => {
        if (dn(t.date) !== d) return false;
        if (t.match) { const o = occs.find(x => x.key === t.match); if (o && o.date === d) return false; }
        return true;
      });
      return { occs: os, txns: ts };
    }
    return { A, today, occs, txns, txById, balAt, occsIn, lowest, dayEntries, counted, H };
  }

  // ---------- pay periods (Ramsey-style paycheck planning) ----------
  function payDates(led) {
    const s = new Set();
    for (const o of led.occs) if (o.item.kind === 'income' && o.item.paycheck && !o.skip) s.add(o.date);
    return [...s].sort((a, b) => a - b);
  }

  function periods(led, from, to) {
    const pays = payDates(led);
    const out = [];
    for (let i = 0; i < pays.length - 1; i++) {
      const s = pays[i], e = pays[i + 1] - 1;
      if (e < from || s > to) continue;
      out.push(periodDetail(led, s, e, pays[i + 1]));
    }
    return out;
